// ============================ ИСТОРИЯ КАРТЫ И ЖУРНАЛ СОБЫТИЙ ============================
var HIST_TYPES = {
  reserve:     { t: 'Напечатана партией', c: 'info' },
  create:      { t: 'Карта создана', c: 'ok' },
  activate:    { t: 'Выдана клиенту', c: 'ok' },
  renew:       { t: 'Подписка продлена', c: 'ok' },
  update:      { t: 'Данные изменены', c: 'info' },
  delete:      { t: 'Карта удалена', c: 'bad' },
  scan_qr:     { t: 'Отсканирован QR-код', c: '' },
  scan_manual: { t: 'Открыта по номеру', c: '' },
  scan_nfc:    { t: 'Приложена NFC-карта', c: 'ok' },
  nfc_denied:  { t: 'Заблокированная NFC-метка', c: 'bad' },
  nfc_add:     { t: 'NFC-метка привязана', c: 'ok' },
  nfc_remove:  { t: 'NFC-метка удалена', c: 'bad' },
  nfc_block:   { t: 'NFC-метка заблокирована', c: 'warn' },
  nfc_unblock: { t: 'NFC-метка разблокирована', c: 'ok' },
  nfc_update:  { t: 'NFC-метка изменена', c: 'info' },
  nfc_move:    { t: 'NFC-метка перепривязана', c: 'info' },
  note:        { t: 'Заметка сотрудника', c: 'warn' }
};
var HIST_FILTERS = [['all', 'Все'], ['visits', 'Сканирования'], ['changes', 'Изменения'], ['nfc', 'NFC']];

function histMatch(type, f) {
  type = String(type || '');
  if (f === 'all') return true;
  if (f === 'visits') return type.indexOf('scan_') === 0 || type === 'nfc_denied';
  if (f === 'nfc') return type.indexOf('nfc_') === 0 || type === 'scan_nfc';
  return type.indexOf('scan_') !== 0 && type.indexOf('nfc_') !== 0; // «Изменения»: выдача, продления, правки, заметки
}

function histChipsHtml(active) {
  return HIST_FILTERS.map(function (f) {
    return '<button type="button" class="chip' + (f[0] === active ? ' on' : '') + '" data-f="' + f[0] + '" style="padding:6px 12px; border-radius:100px;">' + f[1] + '</button>';
  }).join('');
}

function histItemHtml(it, showCard) {
  var meta = HIST_TYPES[it.type] || { t: it.type || 'Событие', c: 'info' };
  var hideDetails = it.type === 'scan_qr' || it.type === 'scan_manual';
  var who = it.cardName || it.cardId;
  return '<div class="hist-item"><span class="hist-dot ' + meta.c + '"></span><div style="min-width:0; flex:1;">' +
    '<div class="hist-title">' + esc(meta.t) + (showCard && who ? ' <span class="hist-card">· ' + esc(who) + '</span>' : '') + '</div>' +
    (it.details && !hideDetails ? '<div class="hist-det">' + esc(it.details) + '</div>' : '') +
    '<div class="hist-meta">' + esc(it.time) + (it.user ? ' · ' + esc(it.user) : '') + (showCard && it.cardName && it.cardId ? ' · ' + esc(it.cardId) : '') + '</div>' +
  '</div></div>';
}

/** Рисует список событий с учётом фильтра в блоке bodyId и подключает фильтры-«чипсы» chipsId */
function renderHistView(st, bodyId, chipsId, showCard, emptyText) {
  var chips = document.getElementById(chipsId);
  if (chips) {
    chips.innerHTML = histChipsHtml(st.filter);
    Array.prototype.forEach.call(chips.querySelectorAll('[data-f]'), function (b) {
      b.onclick = function () { st.filter = b.getAttribute('data-f'); renderHistView(st, bodyId, chipsId, showCard, emptyText); };
    });
  }
  var body = document.getElementById(bodyId);
  if (!body) return;
  var shown = st.items.filter(function (it) { return histMatch(it.type, st.filter); });
  body.innerHTML = shown.length ? shown.map(function (it) { return histItemHtml(it, showCard); }).join('') :
    '<p class="sub" style="margin:8px 0 0;">' + esc(emptyText) + '</p>';
}

var HIST_EMPTY = 'Записей пока нет. История ведётся с момента обновления системы — прежние события здесь не отображаются.';

function showHistoryModal(cardId) {
  openModal(
    '<button class="modal-x" onclick="closeModal()">✕</button>' +
    '<h2>История карты</h2>' +
    '<p class="cid mono" style="color:var(--muted); font-size:12px; margin:2px 0 0;">' + esc(cardId) + '</p>' +
    '<div style="display:flex; gap:8px; margin-top:12px;">' +
      '<input id="hs-note" maxlength="500" placeholder="Заметка в историю…" style="flex:1; min-width:0;">' +
      '<button class="btn-secondary" id="hs-add" style="white-space:nowrap; margin:0;">Добавить</button>' +
    '</div>' +
    '<div id="hs-msg" class="msg hidden"></div>' +
    '<div class="chips" id="hs-chips"></div>' +
    '<div class="hist" id="hs-body">' + skeletonRows(3) + '</div>'
  );
  var st = { items: [], filter: 'all' };
  state.hist = st;

  function load() {
    apiGet('getHistory', { id: cardId, limit: 300, role: state.user.role }).then(function (res) {
      if (state.hist !== st) return; // окно уже закрыто или открыто для другой карты
      var body = document.getElementById('hs-body');
      if (!body) return;
      if (!res || res.error) { body.innerHTML = '<p class="msg err" style="margin:0;">Не удалось загрузить историю' + (res && res.error ? ': ' + esc(res.error) : '') + '</p>'; return; }
      st.items = res.items || [];
      renderHistView(st, 'hs-body', 'hs-chips', false, HIST_EMPTY);
    }).catch(function () {
      var body = document.getElementById('hs-body');
      if (body && state.hist === st) body.innerHTML = '<p class="msg err" style="margin:0;">Нет связи с сервером — история недоступна.</p>';
    });
  }
  load();

  function addNote() {
    var inp = document.getElementById('hs-note');
    var msg = document.getElementById('hs-msg');
    var btn = document.getElementById('hs-add');
    var text = inp.value.trim();
    if (!text) return;
    setBtnLoading(btn, 'Сохраняем…');
    apiPost('logCardEvent', { username: state.user.username, cardId: cardId, type: 'note', details: text }).then(function (res) {
      clearBtnLoading(btn);
      if (res.success) { inp.value = ''; msg.classList.add('hidden'); toast('Заметка добавлена'); load(); }
      else { msg.className = 'msg err'; msg.textContent = res.error; }
    }).catch(function () { clearBtnLoading(btn); msg.className = 'msg err'; msg.textContent = 'Нет связи с сервером'; });
  }
  document.getElementById('hs-add').onclick = addNote;
  document.getElementById('hs-note').addEventListener('keydown', function (e) { if (e.key === 'Enter') addNote(); });
}

// ---- «Ещё → Журнал событий» (админ): последние события по всем картам ----
function renderJournalBlock() {

  card.innerHTML =
    '<h2>Журнал событий</h2>' +
    '<p class="sub" style="margin-bottom:0;">Последние действия по всем картам: выдача, продления, правки, сканирования, NFC. Кто и когда это сделал.</p>' +
    '<div class="chips" id="jr-chips"></div>' +

    '<button class="btn-ghost" id="jr-refresh" style="width:100%; margin-top:10px;">Обновить</button>';
  function load() {
    var btn = document.getElementById('jr-refresh');
    setBtnLoading(btn, 'Обновляем…');
    apiGet('getHistory', { id: '', limit: 150, role: state.user.role }).then(function (res) {
      clearBtnLoading(btn);
      var body = document.getElementById('jr-body');
      if (!body || state.journal !== st) return;
      if (!res || res.error) { body.innerHTML = '<p class="msg err" style="margin:0;">Не удалось загрузить журнал' + (res && res.error ? ': ' + esc(res.error) : '') + '</p>'; return; }
      st.items = res.items || [];
      renderHistView(st, 'jr-body', 'jr-chips', true, HIST_EMPTY);
    }).catch(function () {
      clearBtnLoading(btn);
      var body = document.getElementById('jr-body');
      if (body && state.journal === st) body.innerHTML = '<p class="msg err" style="margin:0;">Нет связи с сервером</p>';
    });
  }
  document.getElementById('jr-refresh').onclick = load;
  load();
}

// ============================ УТИЛИТЫ ============================
function openModal(html) {
  closeModal();
  var ov = document.createElement('div');
  ov.className = 'overlay'; ov.id = 'overlay';
  ov.innerHTML = '<div class="modal">' + html + '</div>';
  ov.addEventListener('click', function (e) { if (e.target === ov) closeModal(); });
  document.body.appendChild(ov);
}
function closeModal() {
  if (credKeep) credKeep = false; else credSession = null; // любое закрытие окна паролей (в т.ч. клик мимо) стирает пароль админа из памяти
  if (state.nfc && state.nfc.owner === 'modal') nfcPhoneStop(false); // окно закрыто — телефонное NFC-чтение из него больше не нужно
  var ov = document.getElementById('overlay'); if (ov) ov.remove();
}

function toast(text) {
  var t = document.createElement('div');
  t.textContent = text;
  t.style.cssText = 'position:fixed; left:50%; bottom:78px; transform:translateX(-50%); background:var(--brand-dark); color:#fff; padding:11px 18px; border-radius:100px; font-size:14px; font-weight:600; z-index:80; box-shadow:0 6px 20px rgba(0,0,0,.2);';
  document.body.appendChild(t);
  setTimeout(function () { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; setTimeout(function () { t.remove(); }, 300); }, 1800);
}

function debounce(fn, ms) {
  var timer;
  return function () { clearTimeout(timer); timer = setTimeout(fn, ms); };
}

/** Склонение слова «месяц» под число (1 месяц, 2 месяца, 5 месяцев, 11 месяцев, 21 месяц…) */
function monthWord(n) {
  var last2 = n % 100;
  if (last2 >= 11 && last2 <= 14) return 'месяцев';
  switch (n % 10) {
    case 1: return 'месяц';
    case 2: case 3: case 4: return 'месяца';
    default: return 'месяцев';
  }
}

/** <option> для выбора срока подписки — весь диапазон от 1 до 12 месяцев */
function monthOptionsHtml() {
  var out = '';
  for (var m = 1; m <= 12; m += 1) {
    out += '<option value="' + m + '">' + m + ' ' + monthWord(m) + '</option>';
  }
  return out;
}

/** Показывает спиннер на кнопке и блокирует повторное нажатие, пока идёт запрос к серверу */
function setBtnLoading(btn, label) {
  if (!btn || btn.dataset.loading === '1') return;
  btn.dataset.loading = '1';
  btn.dataset.origHtml = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>' + esc(label || 'Секунду…');
}
function clearBtnLoading(btn) {
  if (!btn) return;
  btn.disabled = false;
  btn.dataset.loading = '0';
  if (btn.dataset.origHtml !== undefined) btn.innerHTML = btn.dataset.origHtml;
}

function skeletonStats() {
  var out = '';
  for (var i = 0; i < 4; i++) out += '<div class="skel skel-stat"></div>';
  return out;
}
function skeletonRows(n) {
  var out = '';
  for (var i = 0; i < (n || 3); i++) out += '<div class="skel skel-row"></div>';
  return out;
}

// Регистрируем Service Worker — чтобы установленное приложение открывалось мгновенно
// и не оставалось белым экраном, если связи нет прямо в момент запуска.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () { /* не критично, приложение и так работает */ });
  });
}
</script>
