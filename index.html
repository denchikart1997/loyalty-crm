function scanStatus(text, isErr) {
  var el = document.getElementById('scan-status');
  if (!el) return;
  el.textContent = text || '';
  el.className = 'msg' + (isErr ? ' err' : '');
  el.classList.toggle('hidden', !text);
}

// Ленивая загрузка резервного декодера jsQR (только если нет нативного BarcodeDetector)
function loadJsQR() {
  if (window.jsQR) return Promise.resolve(window.jsQR);
  return new Promise(function (resolve, reject) {
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
    s.onload = function () { resolve(window.jsQR); };
    s.onerror = function () { reject(new Error('jsQR load failed')); };
    document.head.appendChild(s);
  });
}

function toggleScanner() {
  if (state.scanning || state.starting) { stopScanner(); return; }
  startScanner();
}

function startScanner() {
  var btn = document.getElementById('scan-btn');
  var stage = document.getElementById('scan-stage');
  var video = document.getElementById('scan-video');

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    scanStatus('Этот браузер не поддерживает камеру. Откройте сайт в Chrome, либо введите номер карты вручную.', true);
    return;
  }

  state.starting = true;
  btn.textContent = 'Запуск камеры…';
  btn.disabled = true;
  scanStatus('Запрашиваем доступ к камере — если на телефоне появится системное окно, нажмите «Разрешить»…');

  // Страховочный таймаут: если за 6 сек камера не пошла — не виснем, а показываем ошибку
  state.startTimeout = setTimeout(function () {
    if (state.starting && !state.scanning) {
      failScan('Камера не отвечает больше 6 секунд. Обычно это значит, что разрешение на камеру для сайта заблокировано на уровне телефона/браузера. Проверьте значок замка слева от адреса → Разрешения → Камера → Разрешить, затем перезагрузите страницу. Можно ввести номер карты вручную.');
    }
  }, 6000);

  try {
    // Мгновенная проверка текущего статуса разрешения, если браузер это поддерживает (не работает в iOS Safari — там просто пропустим)
    if (navigator.permissions && navigator.permissions.query) {
      navigator.permissions.query({ name: 'camera' }).then(function (perm) {
        if (perm.state === 'denied') {
          clearTimeout(state.startTimeout);
          failScan('Доступ к камере заблокирован для этого сайта. Нажмите на значок замка слева от адреса → Разрешения → Камера → Разрешить, затем перезагрузите страницу.');
        }
      }).catch(function () { /* API недоступен на этом браузере — просто продолжаем обычным путём */ });
    }

    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } }, audio: false
    }).then(function (stream) {
      state.stream = stream;
      video.srcObject = stream;
      video.setAttribute('playsinline', 'true');
      return video.play().catch(function () {}); // play может вернуть отклонённый промис на части браузеров — не критично
    }).then(function () {
      clearTimeout(state.startTimeout);
      state.starting = false;
      state.scanning = true;
      stage.classList.remove('hidden');
      btn.disabled = false;
      btn.textContent = 'Остановить камеру';
      scanStatus('Наведите на QR-код');
      beginDetectLoop(video);
      setupTorchButton();
    }).catch(function (err) {
      clearTimeout(state.startTimeout);
      failScan(describeCamError(err));
    });
  } catch (syncErr) {
    clearTimeout(state.startTimeout);
    failScan('Внутренняя ошибка запуска камеры: ' + (syncErr && syncErr.message ? syncErr.message : syncErr) + '. Введите номер карты вручную.');
  }
}

function beginDetectLoop(video) {
  // Вариант A: нативный BarcodeDetector (Chrome на Android)
  if ('BarcodeDetector' in window) {
    var detector;
    try { detector = new window.BarcodeDetector({ formats: ['qr_code'] }); }
    catch (e) { detector = null; }
    if (detector) {
      var tick = function () {
        if (!state.scanning) return;
        detector.detect(video).then(function (codes) {
          if (codes && codes.length) { onScan(codes[0].rawValue); return; }
          state.rafId = requestAnimationFrame(tick);
        }).catch(function () {
          state.rafId = requestAnimationFrame(tick);
        });
      };
      state.rafId = requestAnimationFrame(tick);
      return;
    }
  }
  // Вариант B: резервный jsQR через canvas
  var canvas = document.createElement('canvas');
  var ctx = canvas.getContext('2d', { willReadFrequently: true });
  loadJsQR().then(function (jsQR) {
    var tick = function () {
      if (!state.scanning) return;
      if (video.readyState >= 2 && video.videoWidth) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        var img = ctx.getImageData(0, 0, canvas.width, canvas.height);
        var code = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
        if (code && code.data) { onScan(code.data); return; }
      }
      state.rafId = requestAnimationFrame(tick);
    };
    state.rafId = requestAnimationFrame(tick);
  }).catch(function () {
    scanStatus('Не удалось загрузить модуль распознавания. Введите номер карты вручную.', true);
  });
}

function describeCamError(err) {
  var name = (err && (err.name || err.toString())) || '';
  if (/NotAllowed|Permission|SecurityError/i.test(name)) return 'Доступ к камере запрещён. Нажмите на значок слева от адреса сайта → разрешите камеру → обновите страницу.';
  if (/NotFound|OverConstrained|Devices/i.test(name)) return 'Камера не найдена. Введите номер карты вручную.';
  if (/NotReadable|TrackStart|Abort/i.test(name)) return 'Камера занята другим приложением. Закройте его и попробуйте снова.';
  return 'Не удалось включить камеру: ' + name + '. Можно ввести номер вручную.';
}

function failScan(text) {
  cleanupCamera();
  state.starting = false;
  state.scanning = false;
  var btn = document.getElementById('scan-btn');
  var stage = document.getElementById('scan-stage');
  if (stage) stage.classList.add('hidden');
  if (btn) { btn.disabled = false; btn.textContent = 'Включить камеру'; }
  scanStatus(text || 'Не удалось включить камеру.', true);
}

function cleanupCamera() {
  if (state.rafId) { cancelAnimationFrame(state.rafId); state.rafId = null; }
  if (state.startTimeout) { clearTimeout(state.startTimeout); state.startTimeout = null; }
  if (state.stream) {
    try { state.stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
    state.stream = null;
  }
  var video = document.getElementById('scan-video');
  if (video) { try { video.pause(); } catch (e) {} video.srcObject = null; }
  state.torchOn = false;
  var torchBtn = document.getElementById('torch-btn');
  if (torchBtn) { torchBtn.classList.add('hidden'); torchBtn.textContent = 'Включить фонарик'; }
}

/** Показывает кнопку фонарика, только если конкретная камера и браузер реально это поддерживают
 * (torch управляется через MediaStreamTrack — работает в Chrome/Edge на Android, не работает в iOS Safari). */
function setupTorchButton() {
  var torchBtn = document.getElementById('torch-btn');
  if (!torchBtn || !state.stream) return;
  var track = state.stream.getVideoTracks()[0];
  var caps = track && track.getCapabilities ? (function () { try { return track.getCapabilities(); } catch (e) { return null; } })() : null;
  if (caps && caps.torch) {
    torchBtn.classList.remove('hidden');
    torchBtn.onclick = toggleTorch;
  } else {
    torchBtn.classList.add('hidden'); // на этом устройстве/браузере фонарик недоступен — просто не показываем кнопку
  }
}

function toggleTorch() {
  if (!state.stream) return;
  var track = state.stream.getVideoTracks()[0];
  if (!track) return;
  var next = !state.torchOn;
  track.applyConstraints({ advanced: [{ torch: next }] }).then(function () {
    state.torchOn = next;
    var torchBtn = document.getElementById('torch-btn');
    if (torchBtn) torchBtn.textContent = next ? 'Выключить фонарик' : 'Включить фонарик';
  }).catch(function () {
    toast('Не удалось включить фонарик на этой камере');
  });
}

function stopScanner() {
  cleanupCamera();
  state.scanning = false;
  state.starting = false;
  var btn = document.getElementById('scan-btn');
  var stage = document.getElementById('scan-stage');
  if (stage) stage.classList.add('hidden');
  if (btn) { btn.disabled = false; btn.textContent = 'Включить камеру'; }
  scanStatus('');
}

function onScan(text) {
  stopScanner();
  var id = text; var m = String(text).match(/[?&]id=([^&]+)/); if (m) id = decodeURIComponent(m[1]);
  var inp = document.getElementById('scan-manual'); if (inp) inp.value = id;
  lookupCard(id, 'qr');
}

/** source — откуда пришёл номер ('qr' — камера/ссылка, 'manual' — ввод руками): нужен для истории карты */
function lookupCard(id, source) {
  scanLoading();
  apiGet('getCardInfo', { id: id }).then(function (card) {
    renderScanResult(card);
    if (card && card.found) logScanEvent(card.id, source === 'qr' ? 'scan_qr' : 'scan_manual');
  }).catch(function () {
    var box = document.getElementById('scan-result');
    if (box) box.innerHTML = '<div class="card"><p class="msg err" style="margin:0;">Нет связи с сервером — карту не удалось найти. Попробуйте ещё раз.</p></div>';
  });
}

/** Мгновенная «заглушка» на время поиска: экран реагирует сразу, а не ждёт ответа сервера */
function scanLoading() {
  var box = document.getElementById('scan-result');
  if (box) box.innerHTML = '<div class="card"><div class="skel skel-row" style="margin:0 0 8px;"></div><div class="skel skel-row" style="margin:0;"></div></div>';
}

function renderScanResult(card) {
  var box = document.getElementById('scan-result');
  if (!box) return;
  if (!card.found) {
    box.innerHTML = '<div class="card"><h2>Карта ' + esc(card.id) + '</h2>' +
      '<p class="msg err">Эта карта не найдена в базе.</p>' +
      '<button class="btn-secondary" style="width:100%;margin-top:12px;" onclick="prefillNewFrom(\'' + esc(card.id) + '\')">Создать карту с этим номером</button></div>';
    return;
  }
  // Карта существует в таблице, но подписка ещё не оформлена (партия распечатана заранее и лежит в коробке) — предлагаем выдать её клиенту
  if (!card.endDate) {
    box.innerHTML = renderActivateForm(card);
    wireActivateForm(card.id);
    return;
  }
  var tel = card.phone ? '<a class="tel" href="tel:' + esc(card.phone) + '">' + esc(card.phone) + '</a>' : '—';
  var daysNote = '';
  if (card.status === 'soon') daysNote = ' · осталось ' + card.daysLeft + ' дн.';
  box.innerHTML =
    '<div class="card">' +
      '<div style="display:flex; justify-content:space-between; align-items:center;">' +
        '<h2>' + esc(card.name || 'Без имени') + '</h2>' +
        '<span class="badge s-' + card.status + '">' + STATUS_LABEL[card.status] + '</span>' +
      '</div>' +
      '<p class="cid" style="font-family:ui-monospace,monospace; color:var(--muted); font-size:12px; margin:2px 0 0;">' + esc(card.id) + '</p>' +
      '<dl class="kv">' +
        '<dt>Телефон</dt><dd>' + tel + '</dd>' +
        '<dt>Действует до</dt><dd>' + (card.endDate ? esc(card.endDate) + daysNote : '—') + '</dd>' +
        (card.notes ? '<dt>Заметки</dt><dd style="font-weight:400;">' + esc(card.notes) + '</dd>' : '') +
      '</dl>' +
      '<label>Продлить подписку на</label>' +
      '<select id="rn-months">' + monthOptionsHtml() + '</select>' +
      '<div class="row-btns" style="margin-top:12px;">' +
        '<button class="btn-primary" style="margin:0;" id="rn-btn" onclick="doRenew(\'' + esc(card.id) + '\')">Продлить</button>' +
        '<button class="btn-ghost" onclick="showQrModal(\'' + esc(card.id) + '\')">Показать QR</button>' +
      '</div>' +
      '<div class="row-btns" style="margin-top:8px;">' +
        '<button class="btn-ghost" onclick="showHistoryModal(\'' + esc(card.id) + '\')">История карты</button>' +
        '<button class="btn-ghost" onclick="showCardNfcModal(\'' + esc(card.id) + '\')">NFC-метки</button>' +
      '</div>' +
    '</div>';
  state.lastCard = card.id;
}

function doRenew(id) {
  var btn = document.getElementById('rn-btn');
  var months = document.getElementById('rn-months').value;
  setBtnLoading(btn, 'Продлеваем…');
  apiPostResilient('renewSubscription', { username: state.user.username, cardId: id, months: months }).then(function (res) {
    clearBtnLoading(btn);
    if (res.queued) { toast('Нет связи — продление отправится само'); return; }
    if (res.success) { toast('Продлено до ' + res.card.endDate); renderScanResult(res.card); }
    else alert(res.error);
  }).catch(function () { clearBtnLoading(btn); });
}

/** Форма выдачи заранее напечатанной карты конкретному клиенту — появляется автоматически при сканировании ещё не оформленной карты */
function renderActivateForm(card) {
  return '<div class="card">' +
    '<div style="display:flex; justify-content:space-between; align-items:center;">' +
      '<h2>Новая карта из коробки</h2>' +
      '<span class="badge s-no_data">Не выдана</span>' +
    '</div>' +
    '<p class="cid" style="font-family:ui-monospace,monospace; color:var(--muted); font-size:12px; margin:2px 0 0;">' + esc(card.id) + '</p>' +
    '<p class="sub" style="margin-top:10px;">Эта карта уже напечатана, но ещё не привязана к клиенту. Заполните данные, чтобы выдать её сейчас.</p>' +
    '<label>Имя клиента</label><input id="ac-name">' +
    '<label>Телефон</label><input id="ac-phone" inputmode="tel" placeholder="+7…">' +
    '<label>Срок подписки</label>' +
    '<select id="ac-months">' + monthOptionsHtml() + '</select>' +
    '<button class="btn-primary" id="ac-save">Выдать карту клиенту</button>' +
    '<div id="ac-msg" class="msg"></div>' +
  '</div>';
}

function wireActivateForm(id) {
  var btn = document.getElementById('ac-save');
  btn.onclick = function () {
    var name = document.getElementById('ac-name').value.trim();
    var phone = document.getElementById('ac-phone').value.trim();
    var months = document.getElementById('ac-months').value;
    setBtnLoading(btn, 'Оформляем…');
    apiPostResilient('activateCard', { username: state.user.username, cardId: id, name: name, phone: phone, months: months }).then(function (res) {
      clearBtnLoading(btn);
      if (res.queued) { toast('Нет связи — карта выдана, данные отправятся сами'); renderPendingActivate(id, name); return; }
      if (res.success) { toast('Карта выдана клиенту'); renderScanResult(res.card); }
      else { var m = document.getElementById('ac-msg'); m.className = 'msg err'; m.textContent = res.error; }
    }).catch(function () { clearBtnLoading(btn); });
  };
}

/** Честный «отложенный» экран после выдачи карты офлайн — без выдуманной даты окончания, которую сервер ещё не подтвердил */
function renderPendingActivate(id, name) {
  var box = document.getElementById('scan-result');
  if (!box) return;
  box.innerHTML = '<div class="card">' +
    '<div style="display:flex; justify-content:space-between; align-items:center;">' +
      '<h2>' + esc(name || 'Без имени') + '</h2>' +
      '<span class="badge s-soon">Ожидает синхронизации</span>' +
    '</div>' +
    '<p class="cid" style="font-family:ui-monospace,monospace; color:var(--muted); font-size:12px; margin:2px 0 0;">' + esc(id) + '</p>' +
    '<p class="sub" style="margin-top:10px;">Связи нет — карта выдана локально, данные отправятся на сервер сами при появлении сети. Можно сразу сканировать следующую карту.</p>' +
  '</div>';
}

function prefillNewFrom(id) { go('new'); setTimeout(function () { var el = document.getElementById('nw-id'); if (el) el.value = id; }, 50); }

/** Быстрый переход на вкладку «Сканер» с сразу же включённой камерой — чтобы не делать два отдельных клика (перейти + включить) */
function goScanAndStart() {
  go('scan');
  setTimeout(function () { if (!state.scanning && !state.starting) toggleScanner(); }, 60);
}

// ============================ ВКЛАДКА: ВСЕ КАРТЫ ============================
function viewList(v) {
  var cached = state.cardsCache || readCache('cards');
  if (cached) state.cardsCache = cached;
  state.selectMode = false;
  state.selectedIds = {};
  v.innerHTML =
    '<div class="stats" id="stats">' + (cached ? statsHtml(cached.stats) : skeletonStats()) + '</div>' +
    '<div class="card">' +
      '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">' +
        '<h2 style="margin:0;">Все карты</h2>' +
        '<button class="btn-ghost btn-sm" id="ls-select-toggle" style="margin:0;">Выбрать</button>' +
      '</div>' +
      '<input id="ls-search" placeholder="Поиск по номеру, имени или телефону">' +
      '<div id="ls-selectbar"></div>' +
      '<div class="clist" id="ls-body" style="margin-top:14px;">' + (cached ? cardsListHtml(cached.cards) : skeletonRows(4)) + '</div>' +
    '</div>';
  document.getElementById('ls-search').addEventListener('input', debounce(function () { state.listLimit = LIST_PAGE; refreshList(); }, 250));
  document.getElementById('ls-select-toggle').onclick = toggleSelectMode;
  if (cached) wireListRows(cached.cards);
  // если кэш уже есть — показываем его мгновенно, а актуальные данные подтягиваем в фоне без мигания «Загрузка…»
  refreshList();
}

/** Включает/выключает режим выбора нескольких карт для пакетной печати */
function toggleSelectMode() {
  state.selectMode = !state.selectMode;
  state.selectedIds = {};
  var btn = document.getElementById('ls-select-toggle');
  if (btn) btn.textContent = state.selectMode ? 'Отменить выбор' : 'Выбрать';
  var cards = (state.cardsCache && state.cardsCache.cards) || [];
  var body = document.getElementById('ls-body');
  if (body) { body.innerHTML = cardsListHtml(cards); wireListRows(cards); }
  renderSelectBar();
}

/** Панель «Выбрано: N» с кнопкой печати — появляется, только когда что-то отмечено */
function renderSelectBar() {
  var bar = document.getElementById('ls-selectbar');
  if (!bar) return;
  var n = Object.keys(state.selectedIds || {}).length;
  if (!state.selectMode || !n) { bar.innerHTML = ''; return; }
  bar.innerHTML =
    '<div style="display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--brand-soft); border-radius:10px; padding:10px 12px; margin-top:10px;">' +
      '<span style="font-size:13px; font-weight:700; color:var(--brand-dark);">Выбрано: ' + n + '</span>' +
      '<button class="btn-primary btn-sm" style="margin:0;" id="ls-print-selected">Распечатать (' + n + ')</button>' +
    '</div>';
  document.getElementById('ls-print-selected').onclick = function () {
    printCards(Object.keys(state.selectedIds));
  };
}

function statsHtml(s) {
  return '<div class="stat"><div class="n">' + s.total + '</div><div class="l">Всего</div></div>' +
    '<div class="stat a"><div class="n">' + s.active + '</div><div class="l">Активны</div></div>' +
    '<div class="stat w"><div class="n">' + s.soon + '</div><div class="l">Скоро</div></div>' +
    '<div class="stat e"><div class="n">' + s.expired + '</div><div class="l">Истекли</div></div>';
}

// Список рисуется порциями: на тысячах карт страница не тормозит, а нужная карта находится поиском
var LIST_PAGE = 40;
function cardsListHtml(cards) {
  if (!cards || !cards.length) return '<p class="sub" style="margin:0;">Ничего не найдено.</p>';
  var sel = !!state.selectMode;
  var limit = state.listLimit || LIST_PAGE;
  var rest = cards.length - limit;
  var html = cards.slice(0, limit).map(function (c) {
    var meta = [];
    if (c.phone) meta.push(esc(c.phone));
    if (c.endDate) meta.push('до ' + esc(c.endDate));
    var checked = (state.selectedIds && state.selectedIds[c.id]) ? ' checked' : '';
    return '<div class="citem' + (checked ? ' citem-checked' : '') + '" data-row="' + esc(c.id) + '">' +
      '<div style="display:flex; align-items:center; gap:10px; min-width:0;">' +
        (sel ? '<input type="checkbox" class="citem-check" data-check="' + esc(c.id) + '"' + checked + '>' : '') +
        '<div class="who">' +
          '<div class="nm">' + esc(c.name || 'Без имени') + '</div>' +
          '<div class="meta">' + meta.join(' · ') + '</div>' +
          '<div class="cid">' + esc(c.id) + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="right">' +
        '<span class="badge s-' + c.status + '">' + STATUS_LABEL[c.status] + '</span>' +
        (sel ? '' : '<div style="display:flex; gap:6px;">' +
          '<span class="icon-btn" title="QR-код" data-qr="' + esc(c.id) + '">' + ICON.qr + '</span>' +
          '<span class="icon-btn" title="История" data-hist="' + esc(c.id) + '">' + ICON.clock + '</span>' +
          '<span class="icon-btn" title="Изменить" data-edit="' + esc(c.id) + '">' + ICON.edit + '</span>' +
          '<span class="icon-btn" title="Удалить" data-del="' + esc(c.id) + '" style="color:var(--red);">' + ICON.trash + '</span>' +
        '</div>') +
      '</div>' +
    '</div>';
  }).join('');
  if (rest > 0) html += '<button class="btn-ghost" id="ls-more">Показать ещё (' + rest + ')</button>';
  return html;
}

function wireListRows(cards) {
  var body = document.getElementById('ls-body'); if (!body) return;
  var more = document.getElementById('ls-more');
  if (more) more.onclick = function () {
    state.listLimit = (state.listLimit || LIST_PAGE) + LIST_PAGE * 2;
    body.innerHTML = cardsListHtml(cards);
    wireListRows(cards);
  };
  cards.slice(0, state.listLimit || LIST_PAGE).forEach(function (c) {
    var row = body.querySelector('[data-row="' + cssEsc(c.id) + '"]'); if (!row) return;
    if (state.selectMode) {
      row.onclick = function () {
        if (state.selectedIds[c.id]) delete state.selectedIds[c.id]; else state.selectedIds[c.id] = true;
        var chk = row.querySelector('[data-check]');
        if (chk) chk.checked = !!state.selectedIds[c.id];
        row.classList.toggle('citem-checked', !!state.selectedIds[c.id]);
        renderSelectBar();
      };
      return;
    }
    row.onclick = null;
    row.querySelector('[data-qr]').onclick = function () { showQrModal(c.id); };
    row.querySelector('[data-hist]').onclick = function () { showHistoryModal(c.id); };
    row.querySelector('[data-edit]').onclick = function () { showEditModal(c); };
    row.querySelector('[data-del]').onclick = function () { confirmDeleteCard(c, row); };
  });
}

function cssEsc(s) { return String(s).replace(/["\\]/g, '\\$&'); }

function refreshList() {
  var qEl = document.getElementById('ls-search');
  var q = qEl ? qEl.value : '';
  apiGet('getCardsScreen', { q: q }).then(function (res) {
    if (!res || res.error) return;
    if (!q) { state.cardsCache = res; persistCache('cards', res); } // кэшируем только незафильтрованный список — именно его показываем при повторном открытии вкладки
    var statsEl = document.getElementById('stats'); if (statsEl) statsEl.innerHTML = statsHtml(res.stats);
    var body = document.getElementById('ls-body'); if (!body) return;
    body.innerHTML = cardsListHtml(res.cards);
    wireListRows(res.cards);
  }).catch(function () { /* нет связи — оставляем на экране то, что уже показано (кэш или предыдущий список) */ });
}

function confirmDeleteCard(c, rowEl) {
  openModal(
    '<h2>Удалить карту?</h2>' +
    '<p class="sub">' + esc(c.name || 'Без имени') + ' · ' + esc(c.id) + '<br>Действие необратимо.</p>' +
    '<div class="row-btns" style="margin-top:16px;">' +
      '<button class="btn-ghost" onclick="closeModal()">Отмена</button>' +
      '<button class="btn-danger" id="md-del">Удалить</button>' +
    '</div>'
  );
  var btn = document.getElementById('md-del');
  btn.onclick = function () {
    setBtnLoading(btn, 'Удаляем…');
    closeModal(); // закрываем сразу — не заставляем ждать ответ сервера, чтобы продолжить работу
    if (rowEl) { rowEl.classList.add('removing'); setTimeout(function () { if (rowEl.parentNode) rowEl.remove(); }, 180); }
    if (state.cardsCache) state.cardsCache.cards = state.cardsCache.cards.filter(function (x) { return x.id !== c.id; });
    toast('Карта удаляется…');
    apiPostResilient('deleteCard', { cardId: c.id, username: state.user.username }).then(function (res) {
      if (res.queued) { toast('Нет связи — удаление отправится само'); return; }
      if (res.success) { toast('Карта удалена'); }
      else { alert(res.error); refreshList(); } // если сервер отказал — переcобираем список, чтобы вернуть строку обратно
    }).catch(function () { refreshList(); });
  };
}

  document.getElementById('ed-nfc').onclick = function () { showCardNfcModal(c.id); };
  document.getElementById('ed-save').onclick = function () {
    apiPostResilient('updateCard', {
      username: state.user.username, cardId: c.id,
      name: document.getElementById('ed-name').value,

    }).then(function (res) {

// ---- «Новая → Карта по NFC-метке»: выдать карту на метку или найти карту, к которой метка уже привязана ----
var nnSeq = 0, nnLastKey = '', nnLastAt = 0;

function nnMsg(text, isErr) { return '<p class="msg' + (isErr ? ' err' : '') + '" style="margin:12px 0 0;">' + esc(text) + '</p>'; }

function nnCheck(force) {
  var inp = document.getElementById('nn-uid');
  var box = document.getElementById('nn-box');
  if (!inp || !box) return;
  var raw = inp.value.trim();
  if (!raw) { box.innerHTML = nnMsg('Приложите карту к считывателю или введите номер метки', true); return; }
  var key = raw.replace(/[^0-9a-zA-Z]/g, '').toUpperCase();
  var now = Date.now();
  if (!force && key === nnLastKey && now - nnLastAt < 2500) return; // метка лежит на считывателе — не обрабатываем по кругу
  nnLastKey = key; nnLastAt = now;
  var seq = ++nnSeq;
  box.innerHTML = '<div style="margin-top:12px;"><div class="skel skel-row" style="margin:0 0 8px;"></div><div class="skel skel-row" style="margin:0;"></div></div>';
  try { if (navigator.vibrate) navigator.vibrate(40); } catch (e) {}
  apiGet('getCardByNfc', { uid: raw }).then(function (res) {
    if (seq !== nnSeq || !document.getElementById('nn-box')) return;
    if (!res || res.error) { box.innerHTML = nnMsg((res && res.error) || 'Не удалось проверить метку', true); return; }
    if (!res.found) { nnIssueForm(res.uid || raw); return; }
    nnLinked(res);
  }).catch(function () {
    if (seq !== nnSeq) return;
    box.innerHTML = nnMsg('Нет связи с сервером — метку не удалось проверить. Приложите карту ещё раз.', true);
  });
}

/** Метка свободна: оформляем новую карту сразу с ней или привязываем метку к уже существующей карте */
function nnIssueForm(uid) {
  var box = document.getElementById('nn-box'); if (!box) return;
  box.innerHTML =
    '<div style="margin-top:14px; border-top:1px solid var(--line); padding-top:14px;">' +
      '<div style="display:flex; justify-content:space-between; align-items:center;"><h3 style="margin:0;">Метка свободна</h3><span class="badge s-no_data">Новая</span></div>' +
      '<p class="cid mono" style="color:var(--muted); font-size:12px; margin:2px 0 0;">' + esc(uid) + '</p>' +
      '<label>Имя клиента</label><input id="nn-name">' +
      '<label>Телефон</label><input id="nn-phone" inputmode="tel" placeholder="+7…">' +
      '<label>Срок подписки</label><select id="nn-months">' + monthOptionsHtml() + '</select>' +
      '<label>Заметки</label><input id="nn-notes">' +
      '<button class="btn-primary" id="nn-issue">Выдать карту с этой меткой</button>' +
      '<hr style="border:none; border-top:1px solid var(--line); margin:16px 0 4px;">' +
      '<label>…или привязать метку к уже существующей карте</label>' +
      '<div style="display:flex; gap:8px;"><input id="nn-card-id" placeholder="LC-000123" style="flex:1;">' +
      '<button class="btn-secondary" id="nn-link" style="white-space:nowrap; margin:0;">Привязать</button></div>' +
      '<div id="nn-err" class="msg"></div>' +
    '</div>';
  function fail(text) { var m = document.getElementById('nn-err'); if (m) { m.className = 'msg err'; m.textContent = text; } }
  document.getElementById('nn-issue').onclick = function () {
    var btn = this;
    setBtnLoading(btn, 'Оформляем…');
    apiPost('issueNfcCard', {
      username: state.user.username, uid: uid,
      name: document.getElementById('nn-name').value.trim(),
      phone: document.getElementById('nn-phone').value.trim(),
      months: document.getElementById('nn-months').value,
      notes: document.getElementById('nn-notes').value.trim()
    }).then(function (res) {
      clearBtnLoading(btn);
      if (!res.success) { fail(res.error); return; }
      toast('Карта выдана и привязана к метке');
      state.cardsCache = null;
      nnDone(res.card, 'Карта выдана');
    }).catch(function () { clearBtnLoading(btn); fail('Нет связи с сервером — карта не создана. Приложите метку ещё раз, когда появится связь.'); });
  };
  document.getElementById('nn-link').onclick = function () {
    var btn = this;
    var cardId = document.getElementById('nn-card-id').value.trim();
    if (!cardId) { fail('Укажите номер карты'); return; }
    setBtnLoading(btn, 'Привязываем…');
    apiPost('addNfcTag', { username: state.user.username, uid: uid, cardId: cardId, label: '' }).then(function (res) {
      if (!res.success) { clearBtnLoading(btn); fail(res.error); return; }
      toast('Метка привязана к карте ' + res.tag.cardId);
      state.cardsCache = null;
      return apiGet('getCardInfo', { id: res.tag.cardId }).then(function (card) { nnDone(card, 'Метка привязана'); });
    }).catch(function () { clearBtnLoading(btn); fail('Нет связи с сервером'); });
  };
}

/** Метка уже привязана: показываем карту; админ может перенести метку на другую карту */
function nnLinked(res) {
  var box = document.getElementById('nn-box'); if (!box) return;
  var tag = res.tag, card = res.card;
  var isAdmin = state.user.role === 'admin';
  if (!card || !card.found) {
    box.innerHTML = '<div style="margin-top:14px; border-top:1px solid var(--line); padding-top:14px;"><h3 style="margin:0;">Карта метки не найдена</h3>' +
      '<p class="sub" style="margin:6px 0 0;">Метка <span class="mono">' + esc(tag.uid) + '</span> привязана к карте ' + esc(tag.cardId) + ', но этой карты уже нет в базе.' +
      (isAdmin ? ' Удалите метку в «Ещё → NFC-метки», чтобы привязать её заново.' : ' Сообщите администратору.') + '</p></div>';
    return;
  }
  var blocked = tag.status === 'blocked';
  box.innerHTML = '<div style="margin-top:14px; border-top:1px solid var(--line); padding-top:14px;">' +
    '<div style="display:flex; justify-content:space-between; align-items:center; gap:8px;"><h3 style="margin:0;">Метка уже привязана</h3>' +
      '<span class="badge ' + (blocked ? 's-expired' : 's-active') + '">' + (blocked ? 'Заблокирована' : 'Активна') + '</span></div>' +
    '<p class="sub" style="margin:4px 0 10px;">Новую карту на эту метку не оформить — она уже принадлежит карте:</p>' +
    nnCardSummary(card) + nnActionsHtml(card.id) +
    '<hr style="border:none; border-top:1px solid var(--line); margin:16px 0 4px;">' +
    (isAdmin
      ? '<label>Перенести метку на другую карту</label>' +
        '<div style="display:flex; gap:8px;"><input id="nn-move-id" placeholder="LC-000123" style="flex:1;">' +
        '<button class="btn-secondary" id="nn-move" style="white-space:nowrap; margin:0;">Перенести</button></div>'
      : '<p class="sub" style="margin:8px 0 0; font-size:12.5px;">Перенести метку на другую карту может администратор.</p>') +
    '<div id="nn-err" class="msg"></div></div>';
  var mv = document.getElementById('nn-move');
  if (mv) mv.onclick = function () {
    var btn = this;
    var target = document.getElementById('nn-move-id').value.trim();

  };
}

      '<div class="who"><div class="nm">' + esc(usr.fullName) + (isMe ? ' <span style="color:var(--muted); font-weight:400;">(вы)</span>' : '') + '</div>' +
        '<div class="meta">логин: ' + esc(usr.login) + '</div></div>' +

          '<span class="icon-btn" data-edit>' + ICON.edit + '</span>' +

function wireStaffRows(users) {
  var body = document.getElementById('st-body'); if (!body) return;
  (users || []).forEach(function (usr) {
    var row = body.querySelector('[data-urow="' + cssEsc(usr.login) + '"]'); if (!row) return;
    row.querySelector('[data-edit]').onclick = function () { showUserModal(usr); };
    var del = row.querySelector('[data-del]');
    if (del) del.onclick = function () { confirmDeleteUser(usr, row); };
  });
}

function refreshStaff() {
  apiGet('listUsers', {}).then(function (users) {
    state.staffCache = users || [];
    persistCache('staff', state.staffCache);
    var body = document.getElementById('st-body'); if (!body) return;

  }).catch(function () { /* нет связи — оставляем то, что уже на экране */ });

      '<option value="cashier"' + (!isNew && usr.role === 'cashier' ? ' selected' : '') + '>Кассир</option>' +

function confirmDeleteUser(usr, rowEl) {
  openModal(
    '<h2>Удалить сотрудника?</h2>' +
    '<p class="sub">' + esc(usr.fullName) + ' (' + esc(usr.login) + ')</p>' +
    '<div class="row-btns" style="margin-top:16px;">' +
      '<button class="btn-ghost" onclick="closeModal()">Отмена</button>' +
      '<button class="btn-danger" id="du-btn">Удалить</button>' +
    '</div>'
  );
  document.getElementById('du-btn').onclick = function () {
    closeModal(); // не ждём ответ сервера, чтобы закрыть модалку — само удаление идёт в фоне
    if (rowEl) { rowEl.classList.add('removing'); setTimeout(function () { if (rowEl.parentNode) rowEl.remove(); }, 180); }
    if (state.staffCache) state.staffCache = state.staffCache.filter(function (u) { return u.login !== usr.login; });
    toast('Сотрудник удаляется…');
    apiPost('deleteUser', { actorRole: state.user.role, actorLogin: state.user.username, login: usr.login }).then(function (res) {
      if (res.success) { toast('Сотрудник удалён'); }
      else { alert(res.error); refreshStaff(); } // если сервер отказал (например, «нельзя удалить последнего админа») — вернём список как есть
    }).catch(function () { refreshStaff(); });

// ---- «Ещё → Логины и пароли» (админ) ----
// Пароль администратора проверяется на сервере при каждом открытии списка; в браузере он живёт только пока открыто окно.
var credSession = null; // { pass, users }
var credKeep = false;   // true на время перехода между окнами списка/правки, чтобы closeModal не сбросил сессию

function credClear() { credSession = null; credKeep = false; }

function showCredAuth() {
  openModal(
    '<button class="modal-x" onclick="credClear(); closeModal()">✕</button>' +
    '<h2>Логины и пароли</h2>' +
    '<p class="sub">Введите свой пароль администратора, чтобы открыть список.</p>' +
    '<label>Ваш пароль</label><input id="cr-pass" type="password" autocomplete="current-password">' +
    '<button class="btn-primary" id="cr-go">Показать</button>' +
    '<div id="cr-msg" class="msg"></div>'
  );
  var inp = document.getElementById('cr-pass');
  setTimeout(function () { inp.focus(); }, 60);
  function go() {
    var btn = document.getElementById('cr-go');
    var msg = document.getElementById('cr-msg');
    var pass = inp.value;
    if (!pass) { msg.className = 'msg err'; msg.textContent = 'Введите пароль'; return; }
    setBtnLoading(btn, 'Проверяем…');
    apiPost('listCredentials', { username: state.user.username, password: pass }).then(function (res) {
      clearBtnLoading(btn);
      if (!res.success) { msg.className = 'msg err'; msg.textContent = res.error; return; }
      credSession = { pass: pass, users: res.users || [] };
      showCredList();
    }).catch(function () { clearBtnLoading(btn); msg.className = 'msg err'; msg.textContent = 'Нет связи с сервером'; });
  }
  document.getElementById('cr-go').onclick = go;
  inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); go(); } });
}

function credCopy(text) {
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Скопировано'); } catch (e) { toast('Не удалось скопировать'); }
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast('Скопировано'); }, fallback);
  else fallback();
}

function showCredList() {
  if (!credSession) { showCredAuth(); return; }
  var users = credSession.users;
  credKeep = true;
  var rows = users.map(function (u, i) {
    var role = u.role === 'admin' ? '<span class="badge s-active">Админ</span>' : '<span class="badge s-no_data">Кассир</span>';
    var hasPw = !!u.password;
    return '<div class="cred-row">' +
      '<div class="cred-head"><div class="nm">' + esc(u.fullName) + '</div>' + role + '</div>' +
      '<div class="cred-line"><span class="k">Логин</span><span class="v">' + esc(u.login) + '</span><button class="btn-ghost" data-copy-login="' + i + '">Копировать</button></div>' +
      '<div class="cred-line"><span class="k">Пароль</span>' +
        (hasPw
          ? '<span class="v" id="cr-pw-' + i + '" data-shown="0">••••••••</span><button class="btn-ghost" data-eye="' + i + '">Показать</button>'
          : '<span class="v off">ещё не сохранён — задайте новый или он появится после входа сотрудника</span>') +
      '</div>' +
      '<div class="row-btns" style="margin-top:8px;">' +
        (hasPw ? '<button class="btn-ghost" data-copy-pw="' + i + '">Копировать пароль</button>' : '') +
        '<button class="btn-secondary" data-edit="' + i + '" style="margin:0;">Изменить</button>' +
      '</div></div>';
  }).join('');
  openModal(
    '<button class="modal-x" onclick="credClear(); closeModal()">✕</button>' +
    '<h2>Логины и пароли</h2>' +
    '<p class="sub">Никому не показывайте этот экран. Здесь можно изменить логин и пароль любого сотрудника — он сразу начнёт входить по-новому.</p>' +
    '<div id="cr-list" style="margin-top:12px;">' + (rows || '<p class="sub">Сотрудников пока нет.</p>') + '</div>' +
    '<button class="btn-ghost" style="width:100%;" onclick="credClear(); closeModal()">Закрыть</button>'
  );
  var list = document.getElementById('cr-list');
  Array.prototype.forEach.call(list.querySelectorAll('[data-eye]'), function (b) {
    b.onclick = function () {
      var i = Number(b.getAttribute('data-eye'));
      var el = document.getElementById('cr-pw-' + i);
      var shown = el.getAttribute('data-shown') === '1';
      el.textContent = shown ? '••••••••' : users[i].password;
      el.setAttribute('data-shown', shown ? '0' : '1');
      b.textContent = shown ? 'Показать' : 'Скрыть';
    };
  });
  Array.prototype.forEach.call(list.querySelectorAll('[data-copy-login]'), function (b) {
    b.onclick = function () { credCopy(users[Number(b.getAttribute('data-copy-login'))].login); };
  });
  Array.prototype.forEach.call(list.querySelectorAll('[data-copy-pw]'), function (b) {
    b.onclick = function () { credCopy(users[Number(b.getAttribute('data-copy-pw'))].password); };
  });
  Array.prototype.forEach.call(list.querySelectorAll('[data-edit]'), function (b) {
    b.onclick = function () { showCredEdit(users[Number(b.getAttribute('data-edit'))]); };
  });
}

function showCredEdit(u) {
  credKeep = true;
  openModal(
    '<button class="modal-x" onclick="credClear(); closeModal()">✕</button>' +
    '<h2>Изменить вход</h2>' +
    '<p class="sub">' + esc(u.fullName) + '</p>' +
    '<label>Логин</label><input id="ce-login" value="' + esc(u.login) + '" autocomplete="off" autocapitalize="off" spellcheck="false">' +
    '<label>Пароль</label><input id="ce-pass" value="' + esc(u.password || '') + '" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="' + (u.password ? '' : 'Введите новый пароль') + '">' +
    '<p class="sub" style="margin:6px 0 0; font-size:12.5px;">Не менее 4 символов. После сохранения сотрудник входит по новому логину и паролю.</p>' +
    '<button class="btn-primary" id="ce-save">Сохранить</button>' +
    '<button class="btn-ghost" id="ce-back" style="width:100%; margin-top:10px;">Назад</button>' +
    '<div id="ce-msg" class="msg"></div>'
  );
  document.getElementById('ce-back').onclick = showCredList;
  document.getElementById('ce-save').onclick = function () {
    var btn = this;
    var msg = document.getElementById('ce-msg');
    var login = document.getElementById('ce-login').value.trim();
    var pass = document.getElementById('ce-pass').value;
    function bad(text) { msg.className = 'msg err'; msg.textContent = text; }
    if (!login) { bad('Логин не может быть пустым'); return; }
    if (!pass && !u.password) { bad('Введите пароль — сейчас он не сохранён'); return; }
    if (pass && pass.length < 4) { bad('Пароль слишком короткий (минимум 4 символа)'); return; }
    var passChanged = !!pass && pass !== u.password;
    if (login === u.login && !passChanged) { showCredList(); return; }
    setBtnLoading(btn, 'Сохраняем…');
    apiPost('updateUser', {
      actorRole: state.user.role, origLogin: u.login, login: login,
      password: passChanged ? pass : '', role: u.role, fullName: u.fullName
    }).then(function (res) {
      clearBtnLoading(btn);
      if (!res.success) { bad(res.error); return; }
      var self = u.login.toLowerCase() === state.user.username.toLowerCase();
      if (self) {
        // меняем собственные данные: обновляем сессию, иначе следующая проверка пароля пойдёт со старым логином
        state.user.username = login;
        try { sessionStorage.setItem('crmUser', JSON.stringify(state.user)); } catch (e) {}
        if (passChanged) credSession.pass = pass;
      }
      u.login = login;
      if (passChanged) u.password = pass;
      toast('Сохранено');
      state.staffCache = null;
      apiGet('listUsers', {}).then(function (list) { state.staffCache = list || []; persistCache('staff', state.staffCache); }).catch(function () {});
      showCredList();
    }).catch(function () { clearBtnLoading(btn); bad('Нет связи с сервером'); });
  };
}

/** Превью для настроек: в отличие от обычной наклейки, всегда показывает позицию QR — если фона ещё нет, рисует нейтральную заглушку вместо него, чтобы ползунки были видны в деле */
function bgPreviewHtml(bgUrl, x, y, size, color) {
  var g = clampQrGeometry(x, y, size);
  var bgStyle = bgUrl
    ? 'background-image:url(&quot;' + esc(bgUrl) + '&quot;); background-size:cover; background-position:center;'
    : 'background:repeating-conic-gradient(#eef1ec 0% 25%, #ffffff 0% 50%) 0 0/14px 14px;';
  return '<div class="pcard has-bg" style="' + bgStyle + '">' +
    '<div class="pcard-qr" style="left:' + g.leftPct + '%; top:' + g.topPct + '%; width:' + g.widthPct + '%; height:' + g.heightPct + '%;">' +
      qrImgHtml(cardLink('LC-000000'), color) +
    '</div>' +
    (bgUrl ? '' : '<div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none;"><span style="background:rgba(255,255,255,.85); padding:2px 7px; border-radius:6px; font-size:9px; color:var(--muted); font-weight:600;">фон ещё не загружен</span></div>') +
  '</div>';
}

function wireBgSettings(s) {
  var pendingDataUrl = null;
  var currentBgUrl = s.backgroundImageUrl || '';

  function currentSrc() { return pendingDataUrl || currentBgUrl; }
  function currentColor() {
    var r = document.getElementById('bg-color-r').value, g = document.getElementById('bg-color-g').value, b = document.getElementById('bg-color-b').value;
    return rgbToHex(r, g, b);
  }
  function updatePreview() {
    var x = document.getElementById('bg-x').value, y = document.getElementById('bg-y').value, sz = document.getElementById('bg-size').value;
    var color = currentColor();
    var prev = document.getElementById('bg-preview');
    if (prev) prev.innerHTML = bgPreviewHtml(currentSrc(), x, y, sz, color);
    var swatch = document.getElementById('bg-color-swatch'); if (swatch) swatch.style.background = color;
    var hexEl = document.getElementById('bg-color-hex'); if (hexEl) hexEl.textContent = color;
    var warn = document.getElementById('bg-color-warn');
    if (warn) {
      if (colorLuma(color) > 170) { warn.style.display = ''; warn.className = 'msg err'; warn.textContent = 'Цвет слишком светлый — QR может плохо сканироваться на белом фоне. Лучше выбрать более тёмный и насыщенный оттенок.'; }
      else { warn.style.display = 'none'; }
    }
  }

  // Принудительно синхронизируем превью с текущими значениями ползунков сразу после отрисовки —
  // страховка на случай, если браузер не сразу отрисует позицию по атрибуту value.
  updatePreview();

  document.getElementById('bg-file').addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var msg = document.getElementById('bg-msg');
    msg.className = 'msg'; msg.textContent = 'Обрабатываем изображение…';
    resizeImageFile(file, 1200, 0.85).then(function (dataUrl) {
      pendingDataUrl = dataUrl;
      msg.textContent = '';
      updatePreview();
    }).catch(function () { msg.className = 'msg err'; msg.textContent = 'Не удалось прочитать это изображение.'; });
  });

  ['bg-x', 'bg-y', 'bg-size', 'bg-color-r', 'bg-color-g', 'bg-color-b'].forEach(function (id) {
    document.getElementById(id).addEventListener('input', updatePreview);
  });

  document.getElementById('bg-save').onclick = function () {
    var btn = this;
    var msg = document.getElementById('bg-msg');
    setBtnLoading(btn, 'Сохраняем…');
    apiPost('saveSettings', {
      actorRole: state.user.role,
      backgroundImage: pendingDataUrl || undefined,
      qrX: document.getElementById('bg-x').value,
      qrY: document.getElementById('bg-y').value,
      qrSize: document.getElementById('bg-size').value,
      qrColor: currentColor()
    }).then(function (res) {
      clearBtnLoading(btn);
      if (res.success) {
        state.settings = res.settings;
        persistCache('settings', res.settings);
        toast('Сохранено');
        renderBgSettings();
      } else { msg.className = 'msg err'; msg.textContent = res.error; }
    }).catch(function () { clearBtnLoading(btn); msg.className = 'msg err'; msg.textContent = 'Нет связи с сервером'; });
  };

  var removeBtn = document.getElementById('bg-remove');
  if (removeBtn) removeBtn.onclick = function () {
    var btn = this;
    setBtnLoading(btn, 'Убираем…');
    apiPost('saveSettings', { actorRole: state.user.role, clearBackground: true }).then(function (res) {
      clearBtnLoading(btn);
      if (res.success) { state.settings = res.settings; persistCache('settings', res.settings); toast('Фон убран'); renderBgSettings(); }
      else alert(res.error);
    }).catch(function () { clearBtnLoading(btn); });
  };
}

/** Уменьшает выбранную картинку до разумного размера перед отправкой на сервер — быстрее загрузка, меньше места на Диске */
function resizeImageFile(file, maxDim, quality) {
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        var cw = Math.max(1, Math.round(img.width * scale));
        var ch = Math.max(1, Math.round(img.height * scale));
        var canvas = document.createElement('canvas');
        canvas.width = cw; canvas.height = ch;
        canvas.getContext('2d').drawImage(img, 0, 0, cw, ch);
        resolve(canvas.toDataURL('image/jpeg', quality || 0.85));
      };
      img.onerror = function () { reject(new Error('bad image')); };
      img.src = reader.result;
    };
    reader.onerror = function () { reject(new Error('read error')); };
    reader.readAsDataURL(file);
  });
}


// ============================ ТОВАРЫ И ЦЕНЫ (только админ) ============================
// Проценты наценки для колонок — личная настройка устройства (не требует похода на сервер), по умолчанию 25/30/35%
// Проценты наценки хранятся в Google Таблице (лист Settings) — одинаковы на всех устройствах и попадают в резервную копию.
// В браузере остаётся только локальная копия для мгновенного показа и работы без связи.
var MARKUP_KEY = 'loyaltyMarkupPercentsV1';
var MARKUP_DEFAULT = [25, 30, 35];
function readLocalMarkup() {
  try {
    var v = JSON.parse(localStorage.getItem(MARKUP_KEY) || 'null');
    if (Array.isArray(v) && v.length === 3) return v.map(Number);
  } catch (e) {}
  return null;
}
function loadMarkupPercents() {
  return readLocalMarkup() || (state.settings && state.settings.markupStored && state.settings.markupPercents) || MARKUP_DEFAULT;
}
function saveMarkupPercents(arr) {
  try { localStorage.setItem(MARKUP_KEY, JSON.stringify(arr)); } catch (e) {}
  if (state.settings) { state.settings.markupPercents = arr; state.settings.markupStored = true; persistCache('settings', state.settings); }
  if (state.user && state.user.role === 'admin') {
    apiPostResilient('saveSettings', { actorRole: 'admin', markupPercents: arr }).catch(function () {});
  }
}
/** Согласует локальные проценты с таблицей: если в таблице уже есть значения — они главные; если нет — отправляем туда те, что были в этом браузере */
function applyMarkupFromServer(s) {
  if (!s) return;
  var local = readLocalMarkup();
  if (s.markupStored && Array.isArray(s.markupPercents)) {
    if (!local || local.join(';') !== s.markupPercents.join(';')) {
      try { localStorage.setItem(MARKUP_KEY, JSON.stringify(s.markupPercents)); } catch (e) {}
      ['pm-pct-0', 'pm-pct-1', 'pm-pct-2'].forEach(function (id, i) {
        var el = document.getElementById(id);
        if (el && document.activeElement !== el) el.value = s.markupPercents[i];
      });
      var body = document.getElementById('pm-body');
      if (body && state.productsCache) { body.innerHTML = productsListHtml(state.productsCache); wireProductRows(state.productsCache); }
    }
  } else if (local && local.join(';') !== MARKUP_DEFAULT.join(';') && state.user && state.user.role === 'admin') {
    apiPost('saveSettings', { actorRole: 'admin', markupPercents: local }).catch(function () {}); // единоразовый перенос в таблицу
  }
}
/** Цена с наценкой, округлённая до целого рубля — так удобнее ставить реальные ценники */
function priceWithMarkup(purchasePrice, pct) {
  return Math.round((Number(purchasePrice) || 0) * (1 + (Number(pct) || 0) / 100));
}

    var delBtn = row.querySelector('[data-pdel]'); if (delBtn) delBtn.onclick = function () { confirmDeleteProduct(p, row); };
  });

}

function confirmDeleteProduct(p, rowEl) {

/** CSV собирается прямо на месте из уже загруженного списка — отдельный запрос к серверу не нужен */
function exportProductsCsv() {
  var products = state.productsCache || [];
  if (!products.length) { toast('Нет товаров для экспорта'); return; }
  var pct = loadMarkupPercents();
  var header = ['Название', 'Категория', 'Единица', 'Закупочная цена'].concat(pct.map(function (x) { return 'Цена ' + x + '%'; }));
  var lines = [header.join(',')];
  products.forEach(function (p) {
    var row = [p.name, p.category || '', p.unit || '', (Number(p.price) || 0).toFixed(2)]
      .concat(pct.map(function (x) { return String(priceWithMarkup(p.price, x)); }));
    var cells = row.map(function (c) {
      var s = String(c);
      if (s.indexOf(',') !== -1 || s.indexOf('"') !== -1 || s.indexOf('\n') !== -1) s = '"' + s.replace(/"/g, '""') + '"';
      return s;
    });
    lines.push(cells.join(','));
  });
  var csv = '\ufeff' + lines.join('\n');
  var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'tovary.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}

function exportCsv() {
  window.open(API_BASE_URL + '?action=exportCsv', '_blank');
}

// ============================ NFC: ЧТЕНИЕ, МЕТКИ, ИСТОРИЯ КАРТЫ ============================
// Откуда берётся номер (UID) NFC-карты:
//  • USB-считыватель на компьютере работает как клавиатура: «печатает» UID и Enter в активное поле;
//  • NFC в телефоне — Web NFC (NDEFReader): только Chrome на Android и только по HTTPS.
// Связь «метка ↔ карта лояльности» хранится на сервере (лист NfcTags). Формат записи UID сервер
// сопоставляет сам (hex, hex задом наперёд, десятичное число), поэтому одну и ту же карту можно
// привязать на компьютере, а потом читать телефоном — и наоборот.

var USB_AUTO_KEY = 'loyaltyNfcUsbAuto';
function usbAutoSubmit() { try { return localStorage.getItem(USB_AUTO_KEY) !== '0'; } catch (e) { return true; } }
function setUsbAutoSubmit(on) { try { localStorage.setItem(USB_AUTO_KEY, on ? '1' : '0'); } catch (e) {} }

function nfcSupported() { return 'NDEFReader' in window; }

/** Похоже ли введённое на номер NFC-метки (так «печатает» USB-считыватель), а не на номер карты вида LC-000123 */
function looksLikeUid(v) {
  var s = String(v || '').replace(/[\s:\-.]/g, '');
  return /^[0-9A-Fa-f]{8,32}$/.test(s);
}

function nfcStatus(text, isErr, live) {
  var el = document.getElementById('nfc-status');
  if (!el) return;
  el.innerHTML = (live ? '<span class="nfc-pulse"></span>' : '') + esc(text || '');
  el.className = 'msg' + (isErr ? ' err' : '');
  el.classList.toggle('hidden', !text);
}

// ---- Считывание NFC телефоном (Web NFC) ----
/** owner: 'scan' (вкладка «Сканер») или 'modal' (окно привязки метки); onStop вызывается, когда чтение остановилось. Возвращает false, если запуск невозможен. */
function nfcPhoneStart(onUid, onMsg, owner, onStop) {
  nfcPhoneStop(true);
  if (!nfcSupported()) {
    onMsg('Считывание NFC телефоном работает только в Chrome на Android (по HTTPS). На компьютере используйте USB-считыватель или введите UID вручную.', true);
    return false;
  }
  var ctrl = new AbortController();
  var reader;
  try { reader = new NDEFReader(); } catch (e) { onMsg('NFC недоступен в этом браузере.', true); return false; }
  state.nfc.abort = ctrl;
  state.nfc.owner = owner;
  state.nfc.onStop = onStop || null;
  reader.onreading = function (ev) {
    if (ev && ev.serialNumber) onUid(ev.serialNumber);
    else onMsg('Метка найдена, но её номер (UID) прочитать не удалось.', true);
  };
  reader.onreadingerror = function () {
    onMsg('Метка найдена, но не прочитана. Телефон читает NTAG-карты и брелоки; карты других типов (например MIFARE Classic) надёжнее считывать USB-модулем.', true);
  };
  reader.scan({ signal: ctrl.signal }).then(function () {
    onMsg('Поднесите карту к задней стороне телефона…', false, true);
  }).catch(function (err) {
    if (ctrl.signal.aborted) return;
    var n = err && err.name;
    if (n === 'NotAllowedError') onMsg('Доступ к NFC не разрешён. Разрешите NFC для этого сайта в настройках браузера.', true);
    else if (n === 'NotSupportedError') onMsg('NFC на этом телефоне выключен или отсутствует. Включите NFC в настройках телефона.', true);
    else onMsg('Не удалось включить NFC' + (err && err.message ? ': ' + err.message : ''), true);
    nfcPhoneStop(false);
  });
  return true;
}

function nfcPhoneStop(silent) {
  if (state.nfc.abort) { try { state.nfc.abort.abort(); } catch (e) {} state.nfc.abort = null; }
  var f = state.nfc.onStop;
  state.nfc.onStop = null;
  state.nfc.owner = null;
  if (!silent && f) f();
}

// ---- Вкладка «Сканер»: блок NFC ----
function wireNfcCard() {
  var phoneBtn = document.getElementById('nfc-phone-btn');
  var usbBtn = document.getElementById('nfc-usb-btn');
  var inp = document.getElementById('nfc-usb-input');
  if (!phoneBtn || !usbBtn || !inp) return;
  state.nfc.usbOn = false;

  phoneBtn.onclick = function () {
    if (state.nfc.owner === 'scan' && state.nfc.abort) { nfcPhoneStop(false); return; }
    var ok = nfcPhoneStart(function (uid) { onNfcUid(uid, 'phone'); }, nfcStatus, 'scan', function () {
      var b = document.getElementById('nfc-phone-btn');
      if (b) b.textContent = 'Считывать телефоном';
      var s = document.getElementById('nfc-status');
      if (s && !s.classList.contains('err')) nfcStatus('');
    });
    if (ok) phoneBtn.textContent = 'Остановить чтение телефоном';
  };

  usbBtn.onclick = function () { setUsbMode(!state.nfc.usbOn); };

  inp.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); submitUsb(); }
  });
  inp.addEventListener('input', function () {
    // некоторые модули не шлют Enter — тогда считаем ввод законченным после короткой паузы
    clearTimeout(state.nfc.usbTimer);
    if (usbAutoSubmit() && inp.value.replace(/[\s:\-.]/g, '').length >= 8) state.nfc.usbTimer = setTimeout(submitUsb, 350);
  });
  inp.addEventListener('blur', function () {
    if (!state.nfc.usbOn) return;
    // пока включён режим считывателя, возвращаем фокус в поле — иначе «набранный» картой UID уйдёт в никуда
    setTimeout(function () {
      var a = document.activeElement;
      if (state.nfc.usbOn && (!a || a === document.body)) inp.focus();
    }, 150);
  });
}

function setUsbMode(on) {
  var zone = document.getElementById('nfc-usb-zone');
  var btn = document.getElementById('nfc-usb-btn');
  var inp = document.getElementById('nfc-usb-input');
  if (!zone || !btn || !inp) return;
  state.nfc.usbOn = !!on;
  zone.classList.toggle('hidden', !on);
  btn.textContent = on ? 'Выключить USB-считыватель' : 'USB-считыватель';
  if (on) {
    inp.value = '';
    inp.focus();
    nfcStatus('USB-считыватель включён — приложите карту', false, true);
  } else {
    clearTimeout(state.nfc.usbTimer);
    if (!state.nfc.abort) nfcStatus('');
  }
}

function submitUsb() {
  clearTimeout(state.nfc.usbTimer);
  var inp = document.getElementById('nfc-usb-input');
  if (!inp) return;
  var v = inp.value.trim();
  inp.value = '';
  if (v) onNfcUid(v, 'usb');
}

/** Единая точка входа для любого считанного номера метки (телефон или USB) */
function onNfcUid(raw, source) {
  var key = String(raw).replace(/[^0-9a-zA-Z]/g, '').toUpperCase();
  var now = Date.now();
  if (key === state.nfc.lastUid && now - state.nfc.lastAt < 2500) return; // карта лежит на считывателе — не обрабатываем её по кругу
  state.nfc.lastUid = key;
  state.nfc.lastAt = now;
  lookupNfc(raw);
}

function lookupNfc(raw) {
  var box = document.getElementById('scan-result');
  if (!box) return;
  var seq = ++state.nfc.seq;
  scanLoading();
  try { if (navigator.vibrate) navigator.vibrate(40); } catch (e) {}
  apiGet('getCardByNfc', { uid: raw }).then(function (res) {
    if (seq !== state.nfc.seq) return;
    renderNfcResult(res, raw);
  }).catch(function () {
    if (seq !== state.nfc.seq) return;
    box.innerHTML = '<div class="card"><p class="msg err" style="margin:0;">Нет связи с сервером — метку не удалось проверить. Приложите карту ещё раз.</p></div>';
  });
}

/** Поиск из поля «номер карты»: если ввод похож на UID (его так «печатает» USB-считыватель) — сначала ищем метку, потом карту с таким номером */
function smartLookup(v) {
  if (!looksLikeUid(v)) { lookupCard(v, 'manual'); return; }
  scanLoading();
  var seq = ++state.nfc.seq;
  apiGet('getCardByNfc', { uid: v }).then(function (res) {
    if (seq !== state.nfc.seq) return;
    if (res && res.found) { renderNfcResult(res, v); return; }
    return apiGet('getCardInfo', { id: v }).then(function (card) {
      if (seq !== state.nfc.seq) return;
      if (card && card.found) { renderScanResult(card); logScanEvent(card.id, 'scan_manual'); }
      else renderUnknownTag(res && res.uid ? res.uid : v);
    });
  }).catch(function () { toast('Нет связи с сервером'); });
}

function logScanEvent(cardId, type, uid) {
  if (!state.user || !navigator.onLine) return;
  apiPost('logCardEvent', { username: state.user.username, cardId: cardId, type: type, uid: uid || '' }).catch(function () { /* журнал не должен мешать кассиру */ });
}

function nfcNoteHtml(tag) {
  return '<div class="nfc-note">' + ICON.nfc + '<span>Считано по NFC' + (tag.label ? ' · ' + esc(tag.label) : '') + ' · <span class="mono">' + esc(tag.uid) + '</span></span></div>';
}

function renderNfcResult(res, raw) {
  var box = document.getElementById('scan-result');
  if (!box) return;
  if (!res || res.error) {
    box.innerHTML = '<div class="card"><h2>Метка не распознана</h2><p class="msg err">' + esc((res && res.error) || 'Ошибка сервера') +
      (res && res.uid ? '<br><span class="mono">' + esc(res.uid) + '</span>' : '') + '</p></div>';
    return;
  }
  if (!res.found) { renderUnknownTag(res.uid || raw); return; }
  var tag = res.tag, card = res.card;
  if (!card || !card.found) {
    box.innerHTML = '<div class="card"><h2>Карта метки не найдена</h2>' +
      '<p class="sub">Метка <span class="mono">' + esc(tag.uid) + '</span> привязана к карте ' + esc(tag.cardId) + ', но этой карты уже нет в базе.' +
      (state.user.role === 'admin' ? ' Удалите метку в «Ещё → NFC-метки», чтобы привязать её заново.' : ' Сообщите администратору.') + '</p></div>';
    return;
  }
  if (tag.status === 'blocked') { renderBlockedTag(tag, card); logScanEvent(card.id, 'nfc_denied', tag.uid); return; }
  renderScanResult(card);
  box.insertAdjacentHTML('afterbegin', nfcNoteHtml(tag));
  logScanEvent(card.id, 'scan_nfc', tag.uid);
}

function renderBlockedTag(tag, card) {
  var box = document.getElementById('scan-result');
  if (!box) return;
  box.innerHTML = '<div class="card">' +
    '<div class="nfc-alert">Метка заблокирована — карту по ней обслуживать нельзя</div>' +
    '<h2>' + esc(card.name || 'Без имени') + '</h2>' +
    '<p class="cid mono" style="color:var(--muted); font-size:12px; margin:2px 0 0;">' + esc(card.id) + ' · метка ' + esc(tag.uid) + (tag.label ? ' (' + esc(tag.label) + ')' : '') + '</p>' +
    '<div class="row-btns" style="margin-top:14px;">' +
      '<button class="btn-secondary" id="bt-unblock">Разблокировать метку</button>' +
      '<button class="btn-ghost" id="bt-hist">История карты</button>' +
    '</div><div id="bt-msg" class="msg"></div></div>';
  document.getElementById('bt-hist').onclick = function () { showHistoryModal(card.id); };
  document.getElementById('bt-unblock').onclick = function () {
    var btn = this;
    setBtnLoading(btn, 'Разблокируем…');
    apiPost('updateNfcTag', { actorRole: state.user.role, username: state.user.username, uid: tag.uid, status: 'active' }).then(function (res) {
      clearBtnLoading(btn);
      if (res.success) { toast('Метка разблокирована'); lookupNfc(tag.uid); }
      else { var m = document.getElementById('bt-msg'); m.className = 'msg err'; m.textContent = res.error; }
    }).catch(function () { clearBtnLoading(btn); var m = document.getElementById('bt-msg'); m.className = 'msg err'; m.textContent = 'Нет связи с сервером'; });
  };
}

/** Метка не привязана ни к одной карте — выдаём новую карту сразу с этой меткой или привязываем к уже существующей */
function renderUnknownTag(uid) {
  var box = document.getElementById('scan-result');
  if (!box) return;
  box.innerHTML = '<div class="card">' +
    '<div style="display:flex; justify-content:space-between; align-items:center;">' +
      '<h2>Метка не привязана</h2><span class="badge s-no_data">Новая</span>' +
    '</div>' +
    '<p class="cid mono" style="color:var(--muted); font-size:12px; margin:2px 0 0;">' + esc(uid) + '</p>' +
    '<p class="sub" style="margin-top:10px;">Эта NFC-карта ещё не знакома системе. Оформите на неё новую карту лояльности:</p>' +
    '<label style="margin-top:0;">Имя клиента</label><input id="nf-name">' +
    '<label>Телефон</label><input id="nf-phone" inputmode="tel" placeholder="+7…">' +
    '<label>Срок подписки</label><select id="nf-months">' + monthOptionsHtml() + '</select>' +
    '<button class="btn-primary" id="nf-issue">Выдать карту с этой меткой</button>' +
    '<hr style="border:none; border-top:1px solid var(--line); margin:18px 0 6px;">' +
    '<label>…или привязать метку к уже существующей карте</label>' +
    '<div style="display:flex; gap:8px;">' +
      '<input id="nf-card" placeholder="LC-000123" style="flex:1;">' +
      '<button class="btn-secondary" id="nf-link" style="white-space:nowrap; margin:0;">Привязать</button>' +
    '</div>' +
    '<div id="nf-msg" class="msg"></div></div>';

  function fail(text) { var m = document.getElementById('nf-msg'); if (m) { m.className = 'msg err'; m.textContent = text; } }
  function showCard(card, tag) {
    renderScanResult(card);
    if (tag) box.insertAdjacentHTML('afterbegin', nfcNoteHtml(tag));
    state.cardsCache = null;
  }

  document.getElementById('nf-issue').onclick = function () {
    var btn = this;
    setBtnLoading(btn, 'Оформляем…');
    apiPost('issueNfcCard', {
      username: state.user.username, uid: uid,
      name: document.getElementById('nf-name').value.trim(),
      phone: document.getElementById('nf-phone').value.trim(),
      months: document.getElementById('nf-months').value
    }).then(function (res) {
      clearBtnLoading(btn);
      if (res.success) { toast('Карта выдана и привязана к метке'); showCard(res.card, res.tag); }
      else fail(res.error);
    }).catch(function () { clearBtnLoading(btn); fail('Нет связи с сервером — карта не создана. Приложите метку ещё раз, когда появится связь.'); });
  };

  document.getElementById('nf-link').onclick = function () {
    var btn = this;
    var cardId = document.getElementById('nf-card').value.trim();
    if (!cardId) { fail('Укажите номер карты'); return; }
    setBtnLoading(btn, 'Привязываем…');
    apiPost('addNfcTag', { username: state.user.username, uid: uid, cardId: cardId, label: '' }).then(function (res) {
      if (!res.success) { clearBtnLoading(btn); fail(res.error); return; }
      toast('Метка привязана к карте ' + res.tag.cardId);
      return apiGet('getCardInfo', { id: res.tag.cardId }).then(function (card) { showCard(card, res.tag); });
    }).catch(function () { clearBtnLoading(btn); fail('Нет связи с сервером'); });
  };
}

// ---- Привязка метки: общие элементы ввода UID (используются в нескольких окнах) ----
function nfcCaptureHtml(p) {
  return '<label>Номер метки (UID)</label>' +
    '<div style="display:flex; gap:8px;">' +
      '<input id="' + p + '-uid" class="mono" placeholder="Приложите карту…" autocomplete="off" autocapitalize="off" spellcheck="false" style="flex:1; min-width:0;">' +
      (nfcSupported() ? '<button class="btn-secondary" id="' + p + '-phone" style="white-space:nowrap; margin:0;">Телефон</button>' : '') +
    '</div>' +
    '<p class="sub" id="' + p + '-hint" style="margin:6px 0 0; font-size:12.5px;">Поле уже активно: USB-считыватель сам введёт номер' + (nfcSupported() ? ', либо нажмите «Телефон»' : '') + '. Можно ввести номер вручную.</p>';
}

function wireNfcCapture(p, onEnter, auto) {
  var inp = document.getElementById(p + '-uid');
  var hint = document.getElementById(p + '-hint');
  if (!inp) return;
  var idleTimer = null;
  if (auto && onEnter) {
    // auto: как только номер метки введён (считыватель или телефон) — сразу проверяем её, без лишнего нажатия
    inp.addEventListener('input', function () {
      clearTimeout(idleTimer);
      if (usbAutoSubmit() && looksLikeUid(inp.value)) idleTimer = setTimeout(onEnter, 350);
    });
  }
  var coarse = false;
  try { coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches; } catch (e) {}
  if (!coarse) setTimeout(function () { inp.focus(); }, 60); // на телефоне не вызываем клавиатуру сами
  inp.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); clearTimeout(idleTimer); if (onEnter) onEnter(); }
  });
  var phoneBtn = document.getElementById(p + '-phone');
  if (!phoneBtn) return;
  function setHint(text, isErr) { if (hint) { hint.textContent = text; hint.className = 'sub' + (isErr ? ' msg err' : ''); hint.style.margin = '6px 0 0'; } }
  phoneBtn.onclick = function () {
    if (state.nfc.owner === 'modal' && state.nfc.abort) { nfcPhoneStop(false); return; }
    var ok = nfcPhoneStart(function (uid) {
      inp.value = String(uid).toUpperCase();
      try { if (navigator.vibrate) navigator.vibrate(40); } catch (e) {}
      nfcPhoneStop(false);
      setHint('Метка считана: ' + inp.value, false);
      if (auto && onEnter) onEnter();
    }, setHint, 'modal', function () { var b = document.getElementById(p + '-phone'); if (b) b.textContent = 'Телефон'; });
    if (ok) phoneBtn.textContent = 'Стоп';
  };
}

// ---- Метки одной карты ----
function tagRowHtml(tag, withCard, idx) {
  var blocked = tag.status === 'blocked';
  return '<div class="citem">' +
    '<div class="who">' +
      '<div class="nm">' + esc(tag.label || 'Без названия') + '</div>' +
      '<div class="cid">' + esc(tag.uid) + '</div>' +
      '<div class="meta">' + (withCard ? esc(tag.cardName || 'Без имени') + ' · ' + esc(tag.cardId) + '<br>' : '') +
        'считываний: ' + tag.scans + (tag.lastScan ? ' · последнее ' + esc(tag.lastScan) : '') + '</div>' +
    '</div>' +
    '<div class="right">' +
      '<span class="badge ' + (blocked ? 's-expired' : 's-active') + '">' + (blocked ? 'Заблокирована' : 'Активна') + '</span>' +
      '<span class="icon-btn" title="Настроить метку" data-ti="' + idx + '">' + ICON.edit + '</span>' +
    '</div>' +
  '</div>';
}

function tagListHtml(tags, withCard, emptyText) {
  if (!tags || !tags.length) return '<p class="sub" style="margin:0;">' + esc(emptyText) + '</p>';
  return tags.map(function (t, i) { return tagRowHtml(t, withCard, i); }).join('');
}

function wireTagRows(bodyId, tags, onDone, onBack) {
  var body = document.getElementById(bodyId);
  if (!body) return;
  var btns = body.querySelectorAll('[data-ti]');
  Array.prototype.forEach.call(btns, function (b) {
    b.onclick = function () { showNfcTagModal(tags[Number(b.getAttribute('data-ti'))], onDone, onBack); };
  });
}

function showCardNfcModal(cardId) {

    '<button class="modal-x" onclick="closeModal()">✕</button>' +
    '<h2>NFC-метки карты</h2>' +

/** Настройки одной метки: название, блокировка, перенос на другую карту и удаление (админ), запись ссылки на метку (Android) */
function showNfcTagModal(tag, onDone, onBack) {
  var isAdmin = state.user.role === 'admin';
  var blocked = tag.status === 'blocked';
  var done = onDone || closeModal;
  var back = onBack || closeModal;
  openModal(
    '<button class="modal-x" onclick="closeModal()">✕</button>' +
    '<h2>NFC-метка</h2>' +
    '<p class="cid mono" style="color:var(--muted); font-size:12px; margin:2px 0 0;">' + esc(tag.uid) + '</p>' +
    '<p class="sub" style="margin:8px 0 0;">Карта: ' + (tag.cardName ? esc(tag.cardName) + ' · ' : '') + esc(tag.cardId) + '</p>' +
    '<label>Название</label><input id="nt-label" maxlength="60" value="' + esc(tag.label) + '" placeholder="Например: основная, брелок">' +
    (isAdmin ? '<label>Привязана к карте</label><input id="nt-card" class="mono" value="' + esc(tag.cardId) + '">' : '') +
    '<button class="btn-primary" id="nt-save">Сохранить</button>' +
    '<div class="row-btns" style="margin-top:10px;">' +
      '<button class="' + (blocked ? 'btn-secondary' : 'btn-danger') + '" id="nt-block">' + (blocked ? 'Разблокировать' : 'Заблокировать') + '</button>' +
      (isAdmin ? '<button class="btn-danger" id="nt-del">Удалить метку</button>' : '') +
    '</div>' +
    (nfcSupported()
      ? '<button class="btn-ghost" id="nt-write" style="width:100%; margin-top:10px;">Записать на метку ссылку для клиента</button>' +
        '<p class="sub" style="margin:6px 0 0; font-size:12.5px;">Клиент поднесёт карту к своему телефону — откроется страница со статусом подписки. Запись заменит содержимое метки.</p>'
      : '') +
    '<button class="btn-ghost" id="nt-back" style="width:100%; margin-top:10px;">Назад</button>' +
    '<div id="nt-msg" class="msg"></div>'
  );
  function msg(text, ok) { var m = document.getElementById('nt-msg'); if (m) { m.className = 'msg ' + (ok ? 'ok' : 'err'); m.textContent = text; } }
  function send(payload, btn, busy, okText) {
    setBtnLoading(btn, busy);
    var data = { actorRole: state.user.role, username: state.user.username, uid: tag.uid };
    for (var k in payload) data[k] = payload[k];
    apiPost('updateNfcTag', data).then(function (res) {
      clearBtnLoading(btn);
      if (res.success) { toast(okText); done(); } else msg(res.error);
    }).catch(function () { clearBtnLoading(btn); msg('Нет связи с сервером'); });
  }
  document.getElementById('nt-back').onclick = back;
  document.getElementById('nt-save').onclick = function () {
    var payload = { label: document.getElementById('nt-label').value.trim() };
    var cardEl = document.getElementById('nt-card');
    if (cardEl) payload.cardId = cardEl.value.trim();
    send(payload, this, 'Сохраняем…', 'Сохранено');
  };
  document.getElementById('nt-block').onclick = function () {
    send({ status: blocked ? 'active' : 'blocked' }, this, blocked ? 'Разблокируем…' : 'Блокируем…', blocked ? 'Метка разблокирована' : 'Метка заблокирована');
  };
  var delBtn = document.getElementById('nt-del');
  if (delBtn) delBtn.onclick = function () { confirmDeleteTag(tag, done, function () { showNfcTagModal(tag, onDone, onBack); }); };
  var wr = document.getElementById('nt-write');
  if (wr) wr.onclick = function () {
    var btn = this;
    nfcPhoneStop(true);
    var writer;
    try { writer = new NDEFReader(); } catch (e) { msg('NFC недоступен в этом браузере'); return; }
    setBtnLoading(btn, 'Поднесите метку к телефону…');
    writer.write({ records: [{ recordType: 'url', data: cardLink(tag.cardId) }] }, { overwrite: true }).then(function () {
      clearBtnLoading(btn);
      msg('Ссылка записана на метку. Теперь клиент увидит статус подписки, поднеся её к телефону.', true);
    }).catch(function (err) {
      clearBtnLoading(btn);
      msg('Не удалось записать' + (err && err.message ? ': ' + err.message : '') + '. Эта метка может не поддерживать запись (нужны карты NTAG).');
    });
  };
}

function confirmDeleteTag(tag, onDone, onCancel) {
  openModal(
    '<h2>Удалить NFC-метку?</h2>' +
    '<p class="sub">' + esc(tag.label || 'Без названия') + ' · <span class="mono">' + esc(tag.uid) + '</span><br>Карта ' + esc(tag.cardId) + ' останется, но по этой метке её больше не найти. Метку можно привязать заново.</p>' +
    '<div class="row-btns" style="margin-top:16px;">' +
      '<button class="btn-ghost" id="dt-cancel">Отмена</button>' +
      '<button class="btn-danger" id="dt-ok">Удалить</button>' +
    '</div><div id="dt-msg" class="msg"></div>'
  );
  document.getElementById('dt-cancel').onclick = onCancel || closeModal;
  document.getElementById('dt-ok').onclick = function () {
    var btn = this;
    setBtnLoading(btn, 'Удаляем…');
    apiPost('deleteNfcTag', { actorRole: state.user.role, username: state.user.username, uid: tag.uid }).then(function (res) {
      clearBtnLoading(btn);
      if (res.success) { toast('Метка удалена'); onDone(); }
      else { var m = document.getElementById('dt-msg'); m.className = 'msg err'; m.textContent = res.error; }
    }).catch(function () { clearBtnLoading(btn); var m = document.getElementById('dt-msg'); m.className = 'msg err'; m.textContent = 'Нет связи с сервером'; });
  };
}

function refreshNfcAdmin() {
  var qEl = document.getElementById('na-search');
  var q = qEl ? qEl.value : '';

    var body = document.getElementById('na-body');
