<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Карты лояльности</title>
<!-- Заранее открываем соединение с Google Apps Script: первый запрос не тратит время на установку защищённого канала -->
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="dns-prefetch" href="https://script.google.com">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#2f8f4e">
<style>
  :root {
    --bg: #f3f7f0; --surface: #ffffff; --ink: #16261b; --muted: #6b7c70; --line: #e2ebdd;
    --brand: #2f8f4e; --brand-dark: #24713e; --brand-soft: #e7f4ea;
    --amber: #c9821b; --amber-soft: #fdf1dd; --red: #c8402f; --red-soft: #fbe8e5;
    --radius: 14px; --shadow: 0 1px 2px rgba(20,40,25,.05), 0 6px 20px rgba(20,40,25,.04);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.45; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 96px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); margin-bottom: 14px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.02em; }
  h2 { font-size: 16px; margin: 0 0 4px; letter-spacing: -0.01em; }
  h3 { font-size: 12px; margin: 0 0 10px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
  .sub { color: var(--muted); font-size: 13.5px; margin: 0 0 16px; }
  label { display: block; font-size: 12.5px; color: var(--muted); margin: 12px 0 5px; font-weight: 600; }
  input, select { width: 100%; padding: 12px 13px; border: 1px solid var(--line); border-radius: 10px; font-size: 15px; background: #fff; color: var(--ink); font-family: var(--font); transition: border-color .15s, box-shadow .15s; }
  input:focus, select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  button { cursor: pointer; border: none; border-radius: 10px; padding: 12px 16px; font-size: 15px; font-weight: 600; font-family: var(--font); transition: transform .05s, background .15s, opacity .15s; }
  button:active { transform: scale(.98); }
  .btn-primary { background: var(--brand); color: #fff; width: 100%; margin-top: 16px; }
  .btn-primary:hover { background: var(--brand-dark); }
  .btn-secondary { background: var(--brand-soft); color: var(--brand-dark); }
  .btn-ghost { background: #f1f4ef; color: var(--ink); }
  .btn-danger { background: var(--red-soft); color: var(--red); }
  .btn-sm { padding: 8px 12px; font-size: 13px; border-radius: 8px; }
  .row-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .row-btns > button { flex: 1; min-width: 110px; }
  .msg { font-size: 13px; margin-top: 10px; }
  .msg.err { color: var(--red); } .msg.ok { color: var(--brand-dark); }
  .hidden { display: none !important; }
  .banner { background: var(--amber-soft); border: 1px solid #f2dcae; color: #7a5310; font-size: 13px; padding: 11px 13px; border-radius: 10px; margin-bottom: 14px; }
  .topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: rgba(255,255,255,.85); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .brandmark { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
  .brandmark .leaf { width: 26px; height: 26px; flex: none; }
  .whoami { font-size: 12px; color: var(--muted); text-align: right; line-height: 1.3; }
  .whoami b { color: var(--ink); display: block; font-size: 13px; }
  .link-btn { background: none; color: var(--muted); font-weight: 500; font-size: 12.5px; padding: 4px 0; }
  .tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; display: flex; background: rgba(255,255,255,.94); backdrop-filter: blur(8px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  .tab { flex: 1; text-align: center; padding: 9px 2px 10px; font-size: 11px; color: var(--muted); background: none; border-radius: 0; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .tab svg { width: 21px; height: 21px; }
  .tab.active { color: var(--brand); }
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 11px; border-radius: 100px; font-size: 12.5px; font-weight: 700; }
  .badge::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .s-active { background: var(--brand-soft); color: var(--brand-dark); }
  .s-soon { background: var(--amber-soft); color: var(--amber); }
  .s-expired { background: var(--red-soft); color: var(--red); }
  .s-no_data { background: #eef1ec; color: var(--muted); }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 6px; text-align: center; }
  .stat .n { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
  .stat .l { font-size: 10.5px; color: var(--muted); margin-top: 2px; font-weight: 600; }
  .stat.a .n { color: var(--brand-dark); } .stat.w .n { color: var(--amber); } .stat.e .n { color: var(--red); }
  .clist { display: flex; flex-direction: column; gap: 10px; }
  .citem { border: 1px solid var(--line); border-radius: 12px; padding: 13px; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .citem .who { min-width: 0; }
  .citem .nm { font-weight: 700; font-size: 15px; }
  .citem .meta { font-size: 12.5px; color: var(--muted); margin-top: 2px; word-break: break-word; }
  .citem .cid { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; color: var(--muted); }
  .citem .right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex: none; }
  .icon-btn { background: #f1f4ef; border-radius: 8px; padding: 7px; display: inline-flex; cursor: pointer; }
  .icon-btn svg { width: 16px; height: 16px; display: block; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; font-size: 14px; margin: 14px 0; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; font-weight: 600; }
  .kv a.tel { color: var(--brand-dark); text-decoration: none; }
  #scan-stage { position: relative; width: 100%; aspect-ratio: 1/1; border-radius: 12px; overflow: hidden; background: #0d1a12; margin-bottom: 4px; }
  #scan-video { width: 100%; height: 100%; object-fit: cover; display: block; }
  #scan-stage::after { content: ''; position: absolute; inset: 18%; border: 3px solid rgba(255,255,255,.85); border-radius: 16px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.25); pointer-events: none; }
  .qr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; margin-top: 14px; }
  .qr-cell { text-align: center; border: 1px dashed var(--line); border-radius: 10px; padding: 10px; background: #fff; }
  .qr-cell img, .qr-cell svg { width: 100%; height: auto; }
  .qr-cell .cap { font-size: 11px; margin-top: 5px; font-family: ui-monospace, monospace; color: var(--muted); }
  .overlay { position: fixed; inset: 0; background: rgba(15,25,18,.5); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal { background: #fff; border-radius: 16px; padding: 22px; max-width: 380px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .modal-x { float: right; background: #f1f4ef; border-radius: 8px; width: 30px; height: 30px; padding: 0; font-size: 18px; line-height: 1; color: var(--muted); }
  .public-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .public-card { max-width: 360px; width: 100%; background: var(--surface); border-radius: 20px; padding: 32px 26px; text-align: center; box-shadow: var(--shadow); border: 1px solid var(--line); }
  .public-card .leaf { width: 40px; height: 40px; margin: 0 auto 14px; display: block; }
  .public-status-icon { width: 72px; height: 72px; margin: 6px auto 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .public-status-icon svg { width: 40px; height: 40px; }
  .pi-active { background: var(--brand-soft); color: var(--brand-dark); }
  .pi-soon { background: var(--amber-soft); color: var(--amber); }
  .pi-expired { background: var(--red-soft); color: var(--red); }
  .public-card .big { font-size: 21px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 6px; }
  .public-card .date { font-size: 15px; color: var(--muted); }
  .public-card .date b { color: var(--ink); }
  .public-foot { margin-top: 22px; font-size: 12px; color: var(--muted); }
  /* Наклейка под физический размер карты (85.6 × 54 мм — стандарт банковской карты) */
  .pcard { width: 85.6mm; height: 54mm; box-sizing: border-box; padding: 3mm; border: 0.3mm dashed #aaa; border-radius: 2mm; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.8mm; background: #fff; page-break-inside: avoid; break-inside: avoid; }
  .pcard-head { display: flex; align-items: center; gap: 1.3mm; font-weight: 700; font-size: 9.5px; color: var(--ink); text-align: center; }
  .pcard-head svg { width: 10px; height: 10px; flex: none; }
  .pcard-qr { width: 28mm; height: 28mm; }
  .pcard-qr .qr-slot, .pcard-qr img, .pcard-qr svg { width: 100%; height: 100%; display: block; }
  .pcard-id { font-family: ui-monospace, Menlo, monospace; font-size: 8.5px; color: #666; letter-spacing: .02em; }
  .sheet { display: grid; grid-template-columns: repeat(2, 85.6mm); gap: 4mm; justify-content: center; }
  .sheet-hint { font-size: 12px; color: var(--muted); margin: 10px 0 0; }
  #print-sheet { display: none; }
  @media print {
    @page { size: A4; margin: 10mm; }
    body.printing #print-sheet { display: block !important; }
    body.printing .topbar, body.printing .tabs, body.printing .wrap, body.printing .overlay { display: none !important; }
  }
  @media print { .topbar, .tabs, .no-print { display: none !important; } .wrap { padding: 0; max-width: 100%; } .card { box-shadow: none; border: none; } .qr-grid { grid-template-columns: repeat(3, 1fr); } }

  /* Наклейка с загруженным фоном: фон на всю карту, QR позиционируется поверх по заданным координатам */
  .pcard.has-bg { padding: 0; border: none; display: block; background-size: cover; background-position: center; background-repeat: no-repeat; position: relative; overflow: hidden; }
  .pcard.has-bg .pcard-qr { position: absolute; width: auto; height: auto; }
  .pcard.has-bg .pcard-qr .qr-slot, .pcard.has-bg .pcard-qr img, .pcard.has-bg .pcard-qr svg { width: 100%; height: 100%; display: block; }
  .bg-preview-wrap { display: flex; justify-content: center; margin: 4px 0 14px; padding: 16px 0; background: repeating-linear-gradient(45deg, #f7faf5, #f7faf5 10px, #eef3ea 10px, #eef3ea 20px); border-radius: 12px; overflow: hidden; }
  .bg-preview-inner { width: 100%; max-width: 340px; }
  .bg-preview-inner .pcard { width: 100%; max-width: none; height: auto; aspect-ratio: 85.6 / 54; }

  /* Индикатор загрузки внутри кнопок — чтобы было видно, что система работает, а не зависла */
  .spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid rgba(255,255,255,.45); border-top-color: #fff; border-radius: 50%; animation: sp-rotate .6s linear infinite; margin-right: 7px; vertical-align: -2px; }
  .btn-secondary .spinner, .btn-ghost .spinner { border-color: rgba(47,143,78,.25); border-top-color: var(--brand-dark); }
  @keyframes sp-rotate { to { transform: rotate(360deg); } }

  /* Skeleton-заглушки на время первой загрузки списков */
  .skel { background: linear-gradient(100deg, #eef1ec 30%, #e3e9df 45%, #eef1ec 60%); background-size: 250% 100%; animation: sk-shimmer 1.3s ease-in-out infinite; border-radius: 8px; }
  @keyframes sk-shimmer { 0% { background-position: 140% 0; } 100% { background-position: -40% 0; } }
  .skel-stat { height: 58px; border-radius: 12px; }
  .skel-row { height: 64px; border-radius: 12px; margin-bottom: 10px; }

  /* Плавное исчезновение элемента списка при удалении — без ожидания перезагрузки всего списка */
  .citem.removing { opacity: 0; transform: scale(.96); pointer-events: none; }
  .citem { transition: opacity .18s ease, transform .18s ease; }
  .citem-checked { background: var(--brand-soft); border-color: var(--brand); }
  .citem-check { width: 20px; height: 20px; flex-shrink: 0; accent-color: var(--brand-dark); }

  /* Бейдж статуса связи в шапке — виден только при обрыве/ожидании синхронизации, в остальное время скрыт */
  .conn-badge { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 100px; white-space: nowrap; }
  .conn-badge.hidden { display: none; }
  .conn-badge.conn-off { background: var(--red-soft); color: var(--red); }
  .conn-badge.conn-sync { background: var(--amber-soft); color: var(--amber); }

  /* ---- NFC и история карты ---- */
  .nfc-usb { margin-top: 12px; }
  .nfc-usb input { font-family: ui-monospace, Menlo, monospace; text-align: center; letter-spacing: .04em; border: 2px dashed var(--line); }
  .nfc-usb input:focus { border-style: solid; }
  .nfc-pulse { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--brand); margin-right: 7px; vertical-align: middle; animation: nfc-pulse 1.4s ease-in-out infinite; }
  @keyframes nfc-pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
  .nfc-note { display: flex; align-items: center; gap: 8px; background: var(--brand-soft); color: var(--brand-dark); border-radius: 10px; padding: 9px 12px; font-size: 13px; font-weight: 600; margin-bottom: 12px; }
  .nfc-note svg { width: 18px; height: 18px; flex: none; }
  .nfc-note span { min-width: 0; word-break: break-word; }
  .nfc-alert { background: var(--red-soft); color: var(--red); border-radius: 10px; padding: 11px 13px; font-size: 14px; font-weight: 700; margin: 12px 0; }
  .mono { font-family: ui-monospace, Menlo, monospace; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 4px; }
  .chip { padding: 6px 12px; border-radius: 100px; font-size: 12.5px; font-weight: 700; background: #f1f4ef; color: var(--muted); }
  .chip.on { background: var(--brand-soft); color: var(--brand-dark); }
  .hist { display: flex; flex-direction: column; margin-top: 6px; }
  .hist-item { display: flex; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .hist-item:last-child { border-bottom: none; }
  .hist-dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; flex: none; background: var(--muted); }
  .hist-dot.ok { background: var(--brand); } .hist-dot.warn { background: var(--amber); } .hist-dot.bad { background: var(--red); } .hist-dot.info { background: #3a7bd5; }
  .hist-title { font-weight: 700; font-size: 14px; }
  .hist-title .hist-card { color: var(--muted); font-weight: 500; font-size: 12.5px; }
  .hist-det { font-size: 13px; word-break: break-word; margin-top: 1px; }
  .hist-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* ---- Отклик и адаптивность ---- */
  :root { --topbar-h: 56px; --side-w: 224px; }
  html { -webkit-text-size-adjust: 100%; }
  button, select, input, .icon-btn, .tab, .chip { touch-action: manipulation; } /* убирает задержку нажатия на телефоне */
  input, select { font-size: 16px; }                    /* iOS не «приближает» страницу при фокусе в поле */
  .topbar { min-height: var(--topbar-h); padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
  .tabs { padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
  .overlay { height: 100vh; height: 100dvh; }            /* окна не уезжают под адресную строку мобильного браузера */
  .modal { max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overscroll-behavior: contain; }
  .citem { content-visibility: auto; contain-intrinsic-size: auto 78px; } /* длинные списки не рисуются, пока не доскроллили */
  #scan-result:empty { display: none; }
  #ls-more { width: 100%; margin-top: 12px; }

  /* телефон/планшет с пальцем: крупные цели нажатия */
  @media (pointer: coarse) {
    .icon-btn { padding: 10px; }
    .icon-btn svg { width: 18px; height: 18px; }
    .modal-x { width: 40px; height: 40px; }
    .btn-sm { padding: 11px 14px; }
    .chip { padding: 9px 14px; }
  }
  @media (max-width: 380px) {
    .wrap { padding-left: 12px; padding-right: 12px; }
    .card { padding: 15px; }
    .stat .n { font-size: 19px; }
  }

  /* планшет: чуть шире */
  @media (min-width: 700px) { .wrap { max-width: 720px; } }

  /* компьютер: меню слева, контент шире и в две колонки там, где это удобно */
  @media (min-width: 960px) {
    .topbar { position: sticky; top: 0; z-index: 30; }
    .tabs { top: var(--topbar-h); bottom: auto; right: auto; left: 0; width: var(--side-w); height: calc(100vh - var(--topbar-h));
            flex-direction: column; justify-content: flex-start; gap: 4px; padding: 16px 12px; border-top: none; border-right: 1px solid var(--line);
            background: #fff; backdrop-filter: none; overflow-y: auto; }
    .tab { flex: none; flex-direction: row; justify-content: flex-start; gap: 12px; padding: 12px 14px; font-size: 14.5px; border-radius: 10px; text-align: left; }
    .tab svg { width: 20px; height: 20px; flex: none; }
    .tab:hover { background: #f1f4ef; }
    .tab.active { background: var(--brand-soft); color: var(--brand-dark); }
    .wrap { max-width: none; margin: 0 0 0 var(--side-w); padding: 28px 36px 56px; }
    #view { display: grid; grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); gap: 16px; align-items: start; max-width: 1180px; }
    #view > .card, #view > #scan-result { margin-bottom: 0; }
    #view > .stats { grid-column: 1 / -1; margin-bottom: 0; }
    #view[data-view="list"], #view[data-view="print"] { grid-template-columns: minmax(0, 1fr); max-width: 980px; }
    #view[data-view="new"] { grid-template-columns: minmax(0, 1fr); max-width: 720px; }
    .modal { max-width: 480px; }
    .stat { padding: 16px 8px; } .stat .n { font-size: 26px; } .stat .l { font-size: 12px; }
    .btn-primary:hover, .btn-secondary:hover, .btn-ghost:hover { filter: brightness(.97); }
    .citem:hover { border-color: #cfe0c8; }
  }
  @media (min-width: 1500px) { #view { grid-template-columns: repeat(auto-fit, minmax(480px, 1fr)); } }
  @media print { #view { display: block !important; } .wrap { margin: 0 !important; } }

  /* экран входа: строго по центру и на компьютере, и на телефоне (не зависит от бокового меню) */
  .login-wrap { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; box-sizing: border-box; }
  .login-wrap > .card { width: 100%; max-width: 420px; margin: 0; }
  @media (min-width: 700px) { .login-wrap > .card { padding: 28px 30px; } }

  /* логины и пароли */
  .cred-row { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; background: #fff; }
  .cred-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
  .cred-head .nm { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
  .cred-line { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 14px; }
  .cred-line .k { color: var(--muted); width: 58px; flex: none; }
  .cred-line .v { flex: 1; min-width: 0; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow-wrap: anywhere; font-weight: 600; }
  .cred-line .v.off { color: var(--muted); font-family: inherit; font-weight: 400; }
  .cred-line button { flex: none; margin: 0; padding: 6px 10px; font-size: 13px; }
</style>
</head>

<div id="root"></div>
<div id="print-sheet"></div>
<script>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];

    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = new Array();

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {

          } else {
            _modules[row + r][col + c] = false;
          }

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;

        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

                  || (r == 0 && c == 0) ) {

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;

      var bits = QRUtil.getBCHTypeInfo(data);

      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;

      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

            if (_modules[row][col - c] == null) {

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;

              _modules[row][col - c] = dark;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;

          if (row < 0 || _moduleCount <= row) {

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {

      for (var i = 0; i < rsBlocks.length; i += 1) {

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {

            data[index] = ecdata[r][i];
            index += 1;

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {

        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw new Error('code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')');
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);

    _this.addData = function(data, mode) {

      var newData = null;

      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {

      return _modules[row][col];

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      makeImpl(false, getBestMaskPattern() );

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;
      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +

      qrSvg += '<svg';
      qrSvg += ' width="' + size + 'px"';
      qrSvg += ' height="' + size + 'px"';
      qrSvg += ' xmlns="http://www.w3.org/2000/svg"';
      qrSvg += '>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    return _this;
  };

  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytes = function(s) {
    var bytes = new Array();
    for (var i = 0; i < s.length; i += 1) {
      var c = s.charCodeAt(i);
      bytes.push(c & 0xff);
    }
    return bytes;
  };

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw new Error();
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw new Error(count + ' != ' + numChars);
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = new Array();
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

    PATTERN011 : 3,

  // QRUtil

  var QRUtil = function() {

    var PATTERN_POSITION_TABLE = [
      [],
      [6, 18],
      [6, 22],
      [6, 26],
      [6, 30],
      [6, 34],
      [6, 22, 38],
      [6, 24, 42],
      [6, 26, 46],
      [6, 28, 50],
      [6, 30, 54],
      [6, 32, 58],
      [6, 34, 62],
      [6, 26, 46, 66],
      [6, 26, 48, 70],
      [6, 26, 50, 74],
      [6, 30, 54, 78],
      [6, 30, 56, 82],
      [6, 30, 58, 86],
      [6, 34, 62, 90],
      [6, 28, 50, 72, 94],
      [6, 26, 50, 74, 98],
      [6, 30, 54, 78, 102],
      [6, 28, 54, 80, 106],
      [6, 32, 58, 84, 110],
      [6, 30, 58, 86, 114],
      [6, 34, 62, 90, 118],
      [6, 26, 50, 74, 98, 122],
      [6, 30, 54, 78, 102, 126],
      [6, 26, 52, 78, 104, 130],
      [6, 30, 56, 82, 108, 134],
      [6, 34, 60, 86, 112, 138],
      [6, 30, 58, 86, 114, 142],
      [6, 34, 62, 90, 118, 146],
      [6, 30, 54, 78, 102, 126, 150],
      [6, 24, 50, 76, 102, 128, 154],
      [6, 28, 54, 80, 106, 132, 158],
      [6, 32, 58, 84, 110, 136, 162],
      [6, 26, 54, 82, 110, 138, 166],
      [6, 30, 58, 86, 114, 142, 170]

    var G15 = (1 << 10) | (1 << 8) | (1 << 5) | (1 << 4) | (1 << 2) | (1 << 1) | (1 << 0);
    var G18 = (1 << 12) | (1 << 11) | (1 << 10) | (1 << 9) | (1 << 8) | (1 << 5) | (1 << 2) | (1 << 0);
    var G15_MASK = (1 << 14) | (1 << 12) | (1 << 10) | (1 << 4) | (1 << 1);

    var _this = {};

    var getBCHDigit = function(data) {
      var digit = 0;
      while (data != 0) {
        digit += 1;
        data >>>= 1;
      }
      return digit;
    };

    _this.getBCHTypeInfo = function(data) {
      var d = data << 10;
      while (getBCHDigit(d) - getBCHDigit(G15) >= 0) {
        d ^= (G15 << (getBCHDigit(d) - getBCHDigit(G15) ) );
      }
      return ( (data << 10) | d) ^ G15_MASK;
    };

    _this.getBCHTypeNumber = function(data) {
      var d = data << 12;
      while (getBCHDigit(d) - getBCHDigit(G18) >= 0) {
        d ^= (G18 << (getBCHDigit(d) - getBCHDigit(G18) ) );

      return (data << 12) | d;

      return PATTERN_POSITION_TABLE[typeNumber - 1];

    _this.getMaskFunction = function(maskPattern) {

      switch (maskPattern) {

      case QRMaskPattern.PATTERN000 :
        return function(i, j) { return (i + j) % 2 == 0; };
      case QRMaskPattern.PATTERN001 :
        return function(i, j) { return i % 2 == 0; };
      case QRMaskPattern.PATTERN010 :
        return function(i, j) { return j % 3 == 0; };
      case QRMaskPattern.PATTERN011 :
        return function(i, j) { return (i + j) % 3 == 0; };
      case QRMaskPattern.PATTERN100 :
        return function(i, j) { return (Math.floor(i / 2) + Math.floor(j / 3) ) % 2 == 0; };
      case QRMaskPattern.PATTERN101 :
        return function(i, j) { return (i * j) % 2 + (i * j) % 3 == 0; };
      case QRMaskPattern.PATTERN110 :
        return function(i, j) { return ( (i * j) % 2 + (i * j) % 3) % 2 == 0; };
      case QRMaskPattern.PATTERN111 :
        return function(i, j) { return ( (i * j) % 3 + (i + j) % 2) % 2 == 0; };

      }
    };

    _this.getErrorCorrectPolynomial = function(errorCorrectLength) {
      var a = qrPolynomial([1], 0);
      for (var i = 0; i < errorCorrectLength; i += 1) {

        switch(mode) {
        case QRMode.MODE_NUMBER    : return 10;
        case QRMode.MODE_ALPHA_NUM : return 9;
        case QRMode.MODE_8BIT_BYTE : return 8;
        case QRMode.MODE_KANJI     : return 8;
        default :
          throw new Error('mode:' + mode);
        }

      } else if (type < 27) {

        // 10 - 26

        switch(mode) {
        case QRMode.MODE_NUMBER    : return 12;
        case QRMode.MODE_ALPHA_NUM : return 11;
        case QRMode.MODE_8BIT_BYTE : return 16;
        case QRMode.MODE_KANJI     : return 10;
        default :
          throw new Error('mode:' + mode);
        }

      } else if (type < 41) {

        // 27 - 40

        switch(mode) {
        case QRMode.MODE_NUMBER    : return 14;
        case QRMode.MODE_ALPHA_NUM : return 13;
        case QRMode.MODE_8BIT_BYTE : return 16;
        case QRMode.MODE_KANJI     : return 12;
        default :
          throw new Error('mode:' + mode);
        }

      } else {
        throw new Error('type:' + type);
      }
    };

    _this.getLostPoint = function(qrcode) {

      var lostPoint = 0;

      // LEVEL1

      for (var row = 0; row < moduleCount; row += 1) {
        for (var col = 0; col < moduleCount; col += 1) {

          var sameCount = 0;
          var dark = qrcode.isDark(row, col);

          for (var r = -1; r <= 1; r += 1) {

            if (row + r < 0 || moduleCount <= row + r) {
              continue;
            }

            for (var c = -1; c <= 1; c += 1) {

              if (col + c < 0 || moduleCount <= col + c) {
                continue;
              }

              if (r == 0 && c == 0) {
                continue;
              }

              if (dark == qrcode.isDark(row + r, col + c) ) {
                sameCount += 1;
              }
            }
          }

          if (sameCount > 5) {
            lostPoint += (3 + sameCount - 5);
          }
        }
      };

      // LEVEL2

      for (var row = 0; row < moduleCount - 1; row += 1) {
        for (var col = 0; col < moduleCount - 1; col += 1) {
          var count = 0;
          if (qrcode.isDark(row, col) ) count += 1;
          if (qrcode.isDark(row + 1, col) ) count += 1;
          if (qrcode.isDark(row, col + 1) ) count += 1;
          if (qrcode.isDark(row + 1, col + 1) ) count += 1;
          if (count == 0 || count == 4) {
            lostPoint += 3;
          }
        }
      }

      // LEVEL3

      for (var row = 0; row < moduleCount; row += 1) {
        for (var col = 0; col < moduleCount - 6; col += 1) {
          if (qrcode.isDark(row, col)
              && !qrcode.isDark(row, col + 1)
              &&  qrcode.isDark(row, col + 2)
              &&  qrcode.isDark(row, col + 3)
              &&  qrcode.isDark(row, col + 4)
              && !qrcode.isDark(row, col + 5)
              &&  qrcode.isDark(row, col + 6) ) {
            lostPoint += 40;
          }
        }
      }

      for (var col = 0; col < moduleCount; col += 1) {
        for (var row = 0; row < moduleCount - 6; row += 1) {
          if (qrcode.isDark(row, col)
              && !qrcode.isDark(row + 1, col)
              &&  qrcode.isDark(row + 2, col)
              &&  qrcode.isDark(row + 3, col)
              &&  qrcode.isDark(row + 4, col)
              && !qrcode.isDark(row + 5, col)
              &&  qrcode.isDark(row + 6, col) ) {
            lostPoint += 40;
          }
        }
      }

      // LEVEL4

      var darkCount = 0;

      for (var col = 0; col < moduleCount; col += 1) {
        for (var row = 0; row < moduleCount; row += 1) {
          if (qrcode.isDark(row, col) ) {
            darkCount += 1;
          }
        }
      }

      var ratio = Math.abs(100 * darkCount / moduleCount / moduleCount - 50) / 5;
      lostPoint += ratio * 10;

      return lostPoint;
    };

    return _this;
  }();

  var QRMath = function() {

    var EXP_TABLE = new Array(256);

  for (var k in (params || {})) url += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
  return fetch(url).then(function (r) { return r.json(); });
}
function apiPost(action, payload) {
  var body = Object.assign({ action: action }, payload || {});
  return fetch(API_BASE_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
    .then(function (r) { return r.json(); });
}

// ============================ УСТОЙЧИВОСТЬ К ОБРЫВАМ СВЯЗИ ============================
// Задача: не потерять действие кассира, если интернет пропал на секунду прямо в момент продления/выдачи карты.
// Действие сохраняется локально и уходит на сервер само, как только связь вернётся.
// Специально НЕ используется для createCard/reserveNewCardIds/generateCardId — там сервер сам подбирает
// следующий свободный номер карты, и откладывать такое действие офлайн — риск задвоить номер.

var OFFLINE_QUEUE_KEY = 'loyaltyOfflineQueueV1';
var syncTimer = null;

function loadQueue() {
  try { return JSON.parse(localStorage.getItem(OFFLINE_QUEUE_KEY) || '[]'); } catch (e) { return []; }
}
function saveQueue(q) {
  try { localStorage.setItem(OFFLINE_QUEUE_KEY, JSON.stringify(q)); } catch (e) {}
}
function queueAction(action, payload) {
  var q = loadQueue();
  q.push({ action: action, payload: payload, ts: Date.now() });
  saveQueue(q);
  renderConnStatus();
  scheduleSync(400);
}

/** Как apiPost, но для безопасных к отложенному выполнению действий: при обрыве связи не показывает ошибку,
 * а откладывает действие и повторяет само. Вызывающий код получает { success:true, queued:true } и должен
 * показать это как «отправится само», а не как обычное подтверждённое сохранение. */
function apiPostResilient(action, payload) {
  if (!navigator.onLine) {
    queueAction(action, payload);
    return Promise.resolve({ success: true, queued: true });
  }
  return apiPost(action, payload).catch(function () {
    queueAction(action, payload);
    return { success: true, queued: true };
  });
}

function scheduleSync(delayMs) {
  if (syncTimer) return;
  syncTimer = setTimeout(function () { syncTimer = null; trySyncQueue(); }, delayMs || 4000);
}

function trySyncQueue() {
  var q = loadQueue();
  renderConnStatus();
  if (!q.length) return;
  if (!navigator.onLine) { scheduleSync(); return; }
  var item = q[0];
  apiPost(item.action, item.payload).then(function (res) {
    q = loadQueue(); q.shift(); saveQueue(q);
    if (!res || !res.success) toast('Не удалось отправить одно отложенное действие: ' + ((res && res.error) || 'ошибка сервера'));
    renderConnStatus();
    if (q.length) { scheduleSync(200); } else { toast('Все действия отправлены'); refreshCurrentTab(); }
  }).catch(function () {
    scheduleSync(); // сеть всё ещё недоступна — пробуем позже, элемент очереди не трогаем
  });
}

window.addEventListener('online', function () { renderConnStatus(); trySyncQueue(); });
window.addEventListener('offline', function () { renderConnStatus(); });

function renderConnStatus() {
  var el = document.getElementById('conn-status');
  if (!el) return;
  var n = loadQueue().length;
  if (!navigator.onLine) {
    el.className = 'conn-badge conn-off';
    el.textContent = n ? ('Офлайн · ' + n + ' в очереди') : 'Офлайн';
  } else if (n) {
    el.className = 'conn-badge conn-sync';
    el.textContent = 'Отправка… ' + n;
  } else {
    el.className = 'conn-badge hidden';
    el.textContent = '';
  }
}

/** Обновляет данные текущей открытой вкладки — вызывается после того как очередь синхронизировалась */
function refreshCurrentTab() {
  if (state.activeTab === 'list') refreshList();
  else if (state.activeTab === 'staff') refreshStaff();
}

// ---- Локальный кэш последних загруженных списков — переживает перезагрузку страницы офлайн ----
function persistCache(key, data) {
  try { localStorage.setItem('loyaltyCache:' + key, JSON.stringify(data)); } catch (e) {}
}
function readCache(key) {
  try {
    var raw = localStorage.getItem('loyaltyCache:' + key);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

// ---- Локальная генерация QR (библиотека qrcode-generator подключена отдельным <script> выше) ----
// Работает полностью офлайн: ни один QR-код больше не грузится с внешнего сервиса, поэтому качество связи в магазине ни на что не влияет.

/** Подбирает минимальную версию QR-кода, в которую влезает текст, перебором (эта библиотека не умеет автоопределение сама) */
function makeQrCode(text) {
  for (var t = 1; t <= 40; t += 1) {
    try {
      var qr = qrcode(t, 'M');
      qr.addData(String(text));
      qr.make();
      return qr;
    } catch (e) { /* версия мала для этого текста — пробуем следующую */ }
  }
  throw new Error('Слишком длинный текст для QR-кода');
}

/** SVG-разметка QR: viewBox подстраивает картинку под контейнер через CSS, печатается чётко на любом размере */
function qrSvgMarkup(text, color) {
  var qr = makeQrCode(text);
  var raw = qr.createSvgTag(4); // margin по умолчанию = 4×cellSize — стандартная «тихая зона» вокруг QR
  var m = raw.match(/width="(\d+)px" height="(\d+)px"/);
  var size = m ? m[1] : String(qr.getModuleCount() * 4 + 32);
  raw = raw.replace(/width="\d+px" height="\d+px"/, 'viewBox="0 0 ' + size + ' ' + size + '" width="100%" height="100%" preserveAspectRatio="xMidYMid meet"');
  raw = raw.replace('fill="black"', 'fill="' + (color && /^#[0-9a-fA-F]{6}$/.test(color) ? color : '#000000') + '"');
  return raw;
}

/** HTML одного QR-кода (обёрнутый в .qr-slot) — рисуется в браузере локально, без сети. color — необязательный hex-цвет модулей QR. */
function qrImgHtml(text, color) {
  try {
    return '<div class="qr-slot">' + qrSvgMarkup(text, color) + '</div>';
  } catch (e) {
    return '<div class="qr-slot"><div style="border:1px dashed var(--line); border-radius:10px; padding:16px; text-align:center;">' +
      '<p class="msg err" style="margin:0;">Не удалось построить QR-код для этого номера карты.</p></div></div>';
  }
}

/** Приблизительная яркость цвета (0 — чёрный, 255 — белый) — используется, чтобы предупредить,
 * если выбранный цвет QR слишком светлый и код может плохо сканироваться на белом фоне. */
function colorLuma(hex) {
  var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return 0.299 * r + 0.587 * g + 0.114 * b;
}
function rgbToHex(r, g, b) {
  function h(n) { return ('0' + Number(n).toString(16)).slice(-2); }
  return '#' + h(r) + h(g) + h(b);
}
function hexToRgb(hex) {
  return { r: parseInt(hex.slice(1, 3), 16) || 0, g: parseInt(hex.slice(3, 5), 16) || 0, b: parseInt(hex.slice(5, 7), 16) || 0 };
}

/** HTML одной наклейки-карты (85.6×54мм). Если в настройках загружен свой фон — QR рисуется поверх него по заданным координатам; иначе — стандартный вид с рамкой. */
function cardStickerHtml(id) {
  var s = state.settings;
  if (s && s.backgroundImageUrl) return stickerHtmlWithBg(s.backgroundImageUrl, s.qrX, s.qrY, s.qrSize, id, s.qrColor);
  return stickerHtmlPlain(id, s && s.qrColor);
}

var CARD_W_MM = 85.6, CARD_H_MM = 54;

/** Считает позицию/размер QR в процентах от карты и гарантирует, что QR никогда не вылезет за её границы:
 * размер берём от короткой стороны (высоты) — карта шире, чем выше, а QR всегда квадратный;
 * позицию дополнительно подрезаем, если размер+смещение всё равно не влезает.
 * Проценты (а не мм) намеренно — так один и тот же расчёт одинаково верно работает и на физической
 * карточке 85.6×54мм при печати, и в адаптивном превью, которое само уменьшается под экран телефона. */
function clampQrGeometry(x, y, size) {
  x = Number(x) || 0; y = Number(y) || 0; size = Number(size) || 40;
  if (size < 10) size = 10;
  if (size > 95) size = 95;
  var szMm = size / 100 * CARD_H_MM; // физический размер QR всегда считаем от высоты карты — от неё не выйдет за верх/низ
  var xMaxPct = Math.max(0, (CARD_W_MM - szMm) / CARD_W_MM * 100);
  var yMaxPct = Math.max(0, (CARD_H_MM - szMm) / CARD_H_MM * 100);
  if (x < 0) x = 0;
  if (y < 0) y = 0;
  if (x > xMaxPct) x = xMaxPct;
  if (y > yMaxPct) y = yMaxPct;
  return {
    leftPct: x.toFixed(3),
    topPct: y.toFixed(3),
    widthPct: (szMm / CARD_W_MM * 100).toFixed(3),
    heightPct: size.toFixed(3) // szMm/CARD_H_MM*100 всегда равно исходному size — по построению
  };
}

/** Наклейка поверх произвольного фона. x/y/size — проценты, геометрия всегда подрезается под физический размер карты (85.6×54мм), поэтому одинаково работает и в превью, и при печати. */
function stickerHtmlWithBg(bgUrl, x, y, size, id, color) {
  var g = clampQrGeometry(x, y, size);
  return '<div class="pcard has-bg" style="background-image:url(&quot;' + esc(bgUrl) + '&quot;);">' +
    '<div class="pcard-qr" style="left:' + g.leftPct + '%; top:' + g.topPct + '%; width:' + g.widthPct + '%; height:' + g.heightPct + '%;">' +
      qrImgHtml(cardLink(id), color) +
    '</div>' +
  '</div>';
}

/** Стандартный вид наклейки без фона (как раньше) */
function stickerHtmlPlain(id, color) {
  return '<div class="pcard">' +
    '<div class="pcard-head">' + ICON.leaf + '<span>' + esc(SHOP_NAME) + '</span></div>' +
    '<div class="pcard-qr">' + qrImgHtml(cardLink(id), color) + '</div>' +
    '<div class="pcard-id">' + esc(id) + '</div>' +
  '</div>';
}

/** Печать одной или нескольких карт-наклеек: рендерим в скрытый лист и вызываем печать */
function printCards(ids) {
  var sheet = document.getElementById('print-sheet');
  sheet.innerHTML = '<div class="sheet">' + ids.map(cardStickerHtml).join('') + '</div>';
  document.body.classList.add('printing');
  window.print();
}
window.addEventListener('afterprint', function () {
  document.body.classList.remove('printing');
  var sheet = document.getElementById('print-sheet');
  if (sheet) sheet.innerHTML = '';
});
function baseUrl() { return window.location.origin + window.location.pathname; }
function cardLink(id) { return baseUrl() + '?id=' + encodeURIComponent(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' })[c]; }); }

var state = { user: null, scanning: false, starting: false, stream: null, rafId: null, startTimeout: null, settings: null, cardsCache: null, staffCache: null, activeTab: null, productsCache: null,
  nfc: { abort: null, owner: null, onStop: null, lastUid: '', lastAt: 0, seq: 0, usbOn: false, usbTimer: null }, nfcTags: [], hist: null, journal: null };
var root = document.getElementById('root');

// ============================ РОУТИНГ ПРИ ЗАГРУЗКЕ ============================
window.addEventListener('DOMContentLoaded', function () {
  var params = new URLSearchParams(window.location.search);
  var cardId = params.get('id');
  // Клиент отсканировал карту (в URL есть id) и НЕ является вошедшим сотрудником → публичная страница
  var savedUser = sessionStorage.getItem('crmUser');
  if (cardId && !savedUser) { renderPublic(cardId); return; }
  if (savedUser) { try { state.user = JSON.parse(savedUser); } catch (e) {} }
  warmUpServer(); // пока человек вводит пароль/открывает экран — сервер Google уже просыпается
  if (state.user) renderApp(cardId); else renderLogin();
});

// ============================ ПРОГРЕВ СЕРВЕРА ============================
// Google Apps Script «засыпает» без запросов, и первый запрос после паузы идёт 1–3 секунды вместо долей секунды.
// Поэтому: будим сервер при открытии страницы и пока приложение открыто — раз в 4 минуты лёгким запросом ping.
var KEEPALIVE_MS = 4 * 60 * 1000;
var keepAliveTimer = null;
function warmUpServer() {
  if (!navigator.onLine) return;
  apiGet('ping', {}).catch(function () { /* прогрев не критичен */ });
}
function startKeepAlive() {
  if (keepAliveTimer) return;
  keepAliveTimer = setInterval(function () {
    if (document.visibilityState === 'visible') warmUpServer();
  }, KEEPALIVE_MS);
}
function stopKeepAlive() { if (keepAliveTimer) { clearInterval(keepAliveTimer); keepAliveTimer = null; } }
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && state.user) warmUpServer(); // вернулись во вкладку — сразу будим
});

/** Подтягивает список карт в фоне сразу после входа — вкладка «Карты» открывается мгновенно */
function prefetchCards() {
  if (!navigator.onLine) return;
  apiGet('getCardsScreen', { q: '' }).then(function (res) {
    if (!res || res.error || !res.cards) return;
    state.cardsCache = res;
    persistCache('cards', res);
  }).catch(function () {});
}

/** Автокопия таблицы на Google Диск: сервер сам решает, нужна ли она (если прошлая старше ~20 часов). Запрос в фоне, кассир его не ждёт. */
var autoBackupDone = false;
function triggerAutoBackup() {
  if (autoBackupDone || !navigator.onLine) return;
  autoBackupDone = true;
  apiPost('autoBackup', {}).catch(function () {});
}

// ============================ ПУБЛИЧНАЯ СТРАНИЦА ============================
function renderPublic(cardId) {
  root.innerHTML = '<div class="public-screen"><div class="public-card">' +
    ICON.leaf +
    '<div id="pubBody"><p class="sub" style="margin:20px 0">Проверяем карту…</p></div>' +
    '<div class="public-foot">Карта лояльности · ' + esc(cardId) + '</div>' +
    '</div></div>';

  apiGet('getPublicStatus', { id: cardId }).then(function (res) {
    var body = document.getElementById('pubBody');
    if (!res || !res.found) {
      body.innerHTML = '<div class="public-status-icon pi-expired">' + ICON.x + '</div>' +
        '<p class="big">Карта не найдена</p><p class="date">Обратитесь к сотруднику магазина</p>';
      return;
    }
    if (res.status === 'expired' || res.status === 'no_data') {
      body.innerHTML = '<div class="public-status-icon pi-expired">' + ICON.x + '</div>' +
        '<p class="big">Подписка неактивна</p>' +
        (res.endDate ? '<p class="date">Истекла <b>' + esc(res.endDate) + '</b></p>' : '<p class="date">Оформите подписку на кассе</p>');
    } else if (res.status === 'soon') {
      body.innerHTML = '<div class="public-status-icon pi-soon">' + ICON.clock + '</div>' +
        '<p class="big">Подписка активна</p>' +
        '<p class="date">Действует до <b>' + esc(res.endDate) + '</b><br>осталось ' + res.daysLeft + ' дн.</p>';
    } else {
      body.innerHTML = '<div class="public-status-icon pi-active">' + ICON.check + '</div>' +
        '<p class="big">Подписка активна</p>' +
        '<p class="date">Действует до <b>' + esc(res.endDate) + '</b></p>';
    }
  }).catch(function () {
    document.getElementById('pubBody').innerHTML = '<p class="date">Не удалось проверить карту. Попробуйте позже.</p>';
  });
}

// ============================ ЭКРАН ВХОДА ============================
function renderLogin() {
  var warn = (!API_BASE_URL || API_BASE_URL.indexOf('ВСТАВЬТЕ') !== -1)
    ? '<div class="banner">Не указан адрес API. Откройте index.html и впишите ссылку Apps Script (/exec) в переменную API_BASE_URL.</div>' : '';
  root.innerHTML =
    '<div class="login-wrap">' +
      '<div class="card">' +
        '<div class="brandmark" style="margin-bottom:18px; font-size:18px;">' + ICON.leaf + 'Карты лояльности</div>' +
        warn +
        '<p class="sub">Вход для сотрудников магазина</p>' +
        '<label>Логин</label><input id="lg-user" autocomplete="username">' +
        '<label>Пароль</label><input id="lg-pass" type="password" autocomplete="current-password">' +
        '<button class="btn-primary" id="lg-btn">Войти</button>' +
        '<div id="lg-msg" class="msg err hidden"></div>' +
      '</div>' +
    '</div>';
  document.getElementById('lg-btn').onclick = doLogin;
  document.getElementById('lg-pass').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
}

function doLogin() {
  var u = document.getElementById('lg-user').value.trim();
  var p = document.getElementById('lg-pass').value;
  var msg = document.getElementById('lg-msg');
  msg.classList.add('hidden');
  if (!u || !p) return;
  var btn = document.getElementById('lg-btn');
  btn.textContent = 'Входим…'; btn.disabled = true;
  apiPost('authenticate', { username: u, password: p }).then(function (res) {
    btn.textContent = 'Войти'; btn.disabled = false;
    if (res.success) {
      state.user = { username: u, role: res.role, fullName: res.fullName };
      sessionStorage.setItem('crmUser', JSON.stringify(state.user));
      renderApp(null);
    } else { msg.textContent = res.error || 'Ошибка входа'; msg.classList.remove('hidden'); }
  }).catch(function (e) {
    btn.textContent = 'Войти'; btn.disabled = false;
    msg.textContent = 'Нет связи с сервером: ' + e.message; msg.classList.remove('hidden');
  });
}

function doLogout() {
  stopScanner();
  nfcPhoneStop(true);
  stopKeepAlive();
  state.user = null;
  sessionStorage.removeItem('crmUser');
  // убираем ?id из адреса, чтобы после выхода не улететь на публичную страницу
  history.replaceState(null, '', baseUrl());
  renderLogin();
}

// ============================ КАРКАС ПРИЛОЖЕНИЯ ============================
function renderApp(prefillCardId) {
  var u = state.user;
  var roleLabel = u.role === 'admin' ? 'Администратор' : 'Кассир';
  root.innerHTML =
    '<div class="topbar">' +
      '<div class="brandmark">' + ICON.leaf + 'Лояльность</div>' +
      '<div style="display:flex; align-items:center; gap:10px;">' +
        '<span class="conn-badge hidden" id="conn-status"></span>' +
        '<div class="whoami"><b>' + esc(u.fullName) + '</b>' + roleLabel + '</div>' +
        '<button class="link-btn" id="tb-logout">Выйти</button>' +
      '</div>' +
    '</div>' +
    '<div class="wrap" id="view"></div>' +
    '<nav class="tabs" id="tabs"></nav>';

  document.getElementById('tb-logout').onclick = doLogout;

  var tabs = [{ id: 'scan', label: 'Сканер', icon: ICON.scan }];
  tabs.push({ id: 'list', label: 'Карты', icon: ICON.list });
  tabs.push({ id: 'new', label: 'Новая', icon: ICON.plus });
  tabs.push({ id: 'print', label: 'Печать', icon: ICON.print });
  if (u.role === 'admin') tabs.push({ id: 'staff', label: 'Сотрудники', icon: ICON.people });
  tabs.push({ id: 'settings', label: 'Ещё', icon: ICON.gear });
  state.tabs = tabs;

  var nav = document.getElementById('tabs');
  tabs.forEach(function (t) {
    var b = document.createElement('button');
    b.className = 'tab'; b.id = 'tab-' + t.id;
    b.innerHTML = t.icon + '<span>' + t.label + '</span>';
    b.onclick = function () { go(t.id); };
    nav.appendChild(b);
  });

  if (prefillCardId) { go('scan'); setTimeout(function () { lookupCard(prefillCardId, 'qr'); }, 60); }
  else go('scan');

  loadSettingsOnce();
  renderConnStatus();
  if (loadQueue().length) scheduleSync(200); // если остались несинхронизированные действия с прошлой сессии — досылаем
  startKeepAlive();
  setTimeout(prefetchCards, 500);       // после того как экран «Сканер» уже нарисован
  setTimeout(triggerAutoBackup, 4000);  // и совсем в фоне — резервная копия, если пора
}

/** Настройки (фон наклейки, позиция QR) грузятся один раз за сессию и кэшируются — наклейки нигде не ждут лишний запрос */
function loadSettingsOnce() {
  if (state.settings) return;
  var cached = readCache('settings');
  if (cached) state.settings = cached;
  apiGet('getSettings', {}).then(function (s) { state.settings = s || {}; persistCache('settings', state.settings); applyMarkupFromServer(state.settings); })
    .catch(function () { if (!state.settings) state.settings = {}; });
}

function go(name) {
  state.activeTab = name;
  if (name !== 'scan') {
    stopScanner();
    if (state.nfc.owner === 'scan') nfcPhoneStop(true); // телефонное NFC-чтение живёт только на вкладке «Сканер»
    state.nfc.usbOn = false;
  }
  state.tabs.forEach(function (t) {
    var el = document.getElementById('tab-' + t.id);
    if (el) el.classList.toggle('active', t.id === name);
  });
  var v = document.getElementById('view');
  v.setAttribute('data-view', name); // CSS на компьютере раскладывает карточки по колонкам в зависимости от вкладки
  if (name === 'scan') viewScan(v);
  else if (name === 'list') viewList(v);
  else if (name === 'new') viewNew(v);
  else if (name === 'print') viewPrint(v);
  else if (name === 'staff') viewStaff(v);
  else if (name === 'settings') viewSettings(v);
}

// ============================ ВКЛАДКА: СКАНЕР ============================

      '<button class="btn-primary" id="scan-btn">Включить камеру</button>' +

      '<div id="scan-status" class="msg" style="text-align:center;"></div>' +
      '<label>Или введите номер карты вручную</label>' +
      '<div style="display:flex; gap:8px;">' +
        '<input id="scan-manual" placeholder="LC-000123" style="flex:1;">' +
